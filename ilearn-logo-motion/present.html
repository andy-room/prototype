<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iLearn 버튼 수정안</title>
<!-- 보기 전용: index.html 과 같은 화면에서 오른쪽 조정판만 뺌 (위 막대는 그대로).
     값은 index.html 의 기본값(조정판에서 확정한 값) 그대로 — 보는 사람 브라우저에 저장된 조정값은 쓰지 않음 -->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style></head>
<body>
<iframe title="iLearn 버튼 수정안 — 연수원 메인 화면 위"></iframe>
<script>
  // present.html?invert → 컬러 반전 (주소 뒤 옵션을 그대로 넘김)
  var q=location.search.replace(/^\?/,'');
  document.querySelector('iframe').src='index.html?present'+(q?'&'+q:'');
</script>
</body></html>
