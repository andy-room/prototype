<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iLearn</title>
<!-- 실제 아이런 창(chatgpt.hunet.ai/v3/ilearn)을 본뜬 프로토타입용 창.
     실제 창은 연수원에서만 열리므로, 생김새만 같게 만들고 답변은 미리 써 둔 예시.
     주소 뒤 ?q=질문 이 있으면 그 질문을 바로 보냄 (실제 창의 메시지 전달 기능과 같은 역할) -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--il:#7749F4;--ink:#1A1A1E;--ink2:#55555E;--ink3:#9A9AA4;--line:#ECECF0;--side:#F7F7F8;--sel:#ECECEE;--chip:#F7F5FF;--chipline:#E2DCFA}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:#fff;font-size:14px;letter-spacing:-.2px;-webkit-font-smoothing:antialiased}
  button{font:inherit;letter-spacing:inherit;border:0;background:none;color:inherit;cursor:pointer}
  .app{display:grid;grid-template-columns:164px 1fr;grid-template-rows:52px 1fr;height:100%}
  header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line)}
  header .brand{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700}
  header .brand img{width:18px;height:18px}
  aside{display:flex;flex-direction:column;background:var(--side);padding:12px 8px;border-right:1px solid var(--line)}
  aside .item{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:8px;font-size:13.5px;color:var(--ink);text-align:left}
  aside .item:hover{background:var(--sel)}
  aside .item.on{background:var(--sel);font-weight:500}
  aside .item svg{width:16px;height:16px;flex:none}
  aside hr{border:0;border-top:1px solid var(--line);margin:8px 2px}
  aside .label{font-size:11.5px;color:var(--ink3);padding:6px 10px}
  aside .avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#DDE6FF,#F1E8FF);flex:none}
  aside .bottom{margin-top:auto;font-size:12.5px;color:var(--ink2)}
  main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .log{flex:1;overflow-y:auto;padding:24px 28px 16px;display:flex;flex-direction:column;gap:18px}
  .date{align-self:center;font-size:11.5px;color:var(--ink3)}
  .bot{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start}
  .bot>img{width:16px;height:16px;margin-top:3px}
  .bot .body{font-size:14px;line-height:1.65;white-space:pre-line;min-width:0}
  .bot .meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--ink3)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;white-space:normal}
  .chips button{padding:8px 14px;border:1px solid var(--chipline);border-radius:6px;background:var(--chip);font-size:13px;color:var(--ink)}
  .chips button:hover{border-color:var(--il)}
  .me{align-self:flex-end;max-width:72%;padding:10px 14px;border-radius:14px;background:#F1F1F4;font-size:14px;line-height:1.55}
  .bot a{color:var(--il);text-decoration:none;font-weight:500}
  .dots{display:inline-flex;gap:4px;padding:6px 0}.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:d 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes d{0%,60%,100%{opacity:.3}30%{opacity:1}}
  form{position:relative;margin:0 16px 16px;border:1px solid #D9D9DE;border-radius:10px}
  form textarea{display:block;width:100%;height:60px;resize:none;border:0;outline:none;padding:12px 44px 12px 14px;border-radius:10px;font:inherit;font-size:14px}
  form:focus-within{border-color:var(--il)}
  form button{position:absolute;right:10px;bottom:10px;width:24px;height:24px;border-radius:50%;background:#EDEDF0;color:var(--ink3);font-size:13px}
  form.ready button{background:var(--il);color:#fff}
  .note{position:fixed;left:8px;bottom:6px;font-size:10.5px;color:var(--ink3)}
</style></head>
<body>
<div class="app">
  <header>
    <button aria-label="메뉴 접기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    <span class="brand"><img src="assets/ilearn-logo-purple.svg" alt="">iLearn</span>
  </header>
  <aside>
    <button class="item on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-4-7.5L21 3l-1 4.5A9 9 0 0 1 21 12Z"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17h.01"/></svg>FAQ</button>
    <button class="item" data-q="나에게 맞는 과정 추천해 줘"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 10v11H4V10h3Zm0 0 4-7c1.5 0 2.5 1 2.5 2.5V9h5.2a2 2 0 0 1 2 2.4l-1.4 7A2 2 0 0 1 17.3 20H7"/></svg>과정 추천</button>
    <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg>사내 지식 나눔</button>
    <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c.6 4.5 3.5 7.4 8 8-4.5.6-7.4 3.5-8 8-.6-4.5-3.5-7.4-8-8 4.5-.6 7.4-3.5 8-8Z"/></svg>주제 탐색하기</button>
    <hr>
    <div class="label">개인</div>
    <button class="item"><span class="avatar"></span>개인형 주…</button>
    <button class="item bottom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>상담원 채팅</button>
  </aside>
  <main>
    <div class="log" id="log">
      <div class="date" id="date"></div>
      <div class="bot"><img src="assets/ilearn-logo-purple.svg" alt=""><div class="body">홍길동님, 안녕하세요!
AI튜터 아이런(iLearn)입니다 😊

온라인 연수원 및 학습 진행과 관련하여 궁금하신 사항을 말씀해 주세요<div class="chips" id="faq"></div></div></div>
    </div>
    <form id="f"><textarea id="t" placeholder="학습 진행 중 궁금한 내용을 입력해 보세요" aria-label="질문 입력"></textarea><button type="submit" aria-label="보내기">↑</button></form>
  </main>
</div>
<div class="note">프로토타입 — 답변은 예시입니다</div>
<script>
(function(){
  var d=new Date(), W='일월화수목금토';
  document.getElementById('date').textContent=d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+W[d.getDay()]+'요일';
  var FAQ=['휴대폰 본인인증 번호가 수신되지 않아','학습중인 과정은 어디서 확인해?','수강신청 기간이 언제야?','연수원 모바일 앱 설치 방법을 알려줘','동영상 오류 메시지가 뜨는데 어떻게 해야할지 알려줘','수료증 출력은 어디서 해?','수료기준은 어디서 확인해?','mOTP 인증이 안돼','상담원을 연결해줘','교재 배송은 언제 와?'];
  var faq=document.getElementById('faq');
  FAQ.forEach(function(q){var b=document.createElement('button');b.type='button';b.textContent='"'+q+'"';b.onclick=function(){ask(q)};faq.appendChild(b)});
  document.querySelectorAll('aside [data-q]').forEach(function(b){b.onclick=function(){ask(b.dataset.q)}});

  var log=document.getElementById('log');
  function esc(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
  function add(html,cls){var el=document.createElement('div');el.className=cls;el.innerHTML=html;log.appendChild(el);log.scrollTop=log.scrollHeight;return el}
  var A={
    '추천':'관심 분야와 최근 학습 기록을 보고 골라 봤어요.\n\n<a href="#">① [AI포럼] AI Native, 조직을 다시 설계하다</a>\n<a href="#">② 170년 유리 기업의 AI 전환, 코닝의 원천기술 재배치 전략</a>\n<a href="#">③ 2026년 교육 체계 수립 설명회</a>\n\n더 짧은 과정이 필요하면 말씀해 주세요.',
    '요약':'지금 보고 계신 「170년 유리 기업의 AI 전환」을 3줄로 정리했어요.\n\n1. AI 데이터센터 경쟁이 전력·냉각·연결로 넓어지고 있어요.\n2. 코닝은 광섬유를 연결 효율을 좌우하는 핵심 해법으로 다시 정의했어요.\n3. 쌓아 온 원천기술과 병목 발견, 수요 기반 증설이 성장 전략이 됐어요.',
    '계획':'이번 주는 하루 15분씩, 이렇게 해 보면 어떨까요?\n\n월 · AI포럼 643회 앞부분\n화 · AI포럼 643회 마무리\n수 · 코닝 사례 읽기\n목 · 배운 점 3줄 정리\n금 · 쉬어 가기',
    '용어':'궁금한 용어를 그대로 적어 주세요. 강의 내용에 맞춰 쉬운 말로 풀어 드릴게요.'
  };
  function ask(q){
    add(esc(q),'me');
    var b=add('<img src="assets/ilearn-logo-purple.svg" alt=""><div class="body"><span class="dots"><i></i><i></i><i></i></span></div>','bot');
    var k=/추천|과정/.test(q)?'추천':/요약/.test(q)?'요약':/계획/.test(q)?'계획':/용어/.test(q)?'용어':null;
    setTimeout(function(){
      b.querySelector('.body').innerHTML=(k?A[k]:'좋은 질문이에요! 프로토타입이라 실제 답변은 아직 연결돼 있지 않아요.')+'<div class="meta">방금 · 👍 👎</div>';
      log.scrollTop=log.scrollHeight;
    },900);
  }
  var f=document.getElementById('f'), t=document.getElementById('t');
  t.addEventListener('input',function(){f.classList.toggle('ready',!!t.value.trim())});
  t.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();f.requestSubmit()}});
  f.addEventListener('submit',function(e){e.preventDefault();var v=t.value.trim();if(!v)return;t.value='';f.classList.remove('ready');ask(v)});
  // 연수원 쪽에서 질문을 넘겨받음 (주소 ?q= 또는 이미 열린 창에 메시지로)
  var q=new URLSearchParams(location.search).get('q'); if(q) setTimeout(function(){ask(q)},300);
  addEventListener('message',function(e){ if(e.data&&e.data.type==='HUNET_CHATBOT_SEND_MESSAGE'&&e.data.data&&e.data.data.message) ask(e.data.data.message) });
})();
</script>
</body></html>
