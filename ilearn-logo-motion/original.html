<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이런 버튼만 보기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 버튼만 보기: 메인 화면 없이 빈 배경 가운데에 버튼을 2배로 */
  html,body{margin:0;height:100%;background:#F5F4F9;font-family:"Noto Sans KR",sans-serif}
  .proto-remote{display:none!important}
  /* 버튼은 칸 아래쪽 가운데에 두고(위로 펼쳐지는 목록 자리 확보), 배율은 칸 크기에 맞춰 자동(--k, 최대 2배)
     → 가장 긴 문구로 캡슐이 늘거나 목록이 펼쳐져도 칸 안에 다 들어옴 */
  :root{--k:2}
  #ilearn-fab{right:auto!important;top:auto!important;left:50%;bottom:14%!important;transform:translateX(-50%) scale(var(--k));transform-origin:50% 100%}
  /* 개선안: 늘 가운데. 늘고 줄 때는 실제 화면처럼 오른쪽 끝을 고정해 왼쪽 끝만 움직이고,
     크기 변화가 끝나면 그 폭의 절반(--half)으로 다시 재서 가운데로 부드럽게 옮김 */
  :root{--half:110px}
  .v2{left:auto!important;top:auto!important;right:calc(50% - var(--half) * var(--k))!important;bottom:14%!important;transform:scale(var(--k));transform-origin:100% 100%;transition:right .45s cubic-bezier(.3,.7,.2,1)}
  /* 질문 목록은 버튼 가운데 위로 펼침 → 원으로 접힌 상태에서도 칸 밖으로 잘리지 않음 (목업 보기는 실제처럼 오른쪽 정렬 유지) */
  html .v2 .v2-menu{right:auto;left:50%;transform:translate(-50%,6px)}
  html .v2.open .v2-menu{transform:translate(-50%,0)}
  .stage-note{position:fixed;left:0;right:0;bottom:3%;text-align:center;font-size:13px;color:#8A879C}
</style></head>
<body>
<div class="stage-note">마우스를 올리면 물어볼 거리, 누르면 아이런 창</div>
<!-- ===== 프로토타입용 플로팅 버튼 =====
     주소 뒤 ?c=0 원본 / ?c=4 개선안 흰 바탕 캡슐(ilearn-v2.html)
     (예전 시안: ?c=1 샤인 스윕 / ?c=2 회전 링 / ?c=3 1차 개선안 — 아래 띠에선 숨김)
     공통 규칙: 대기 상태는 은은하게, 테두리 색·글로우 등 강조는 호버·누름에서만 -->
<style>
  /* 원격지원 — 원본 이미지 그대로 */
  /* 실제 사이트에서 잰 위치: 원격지원은 오른쪽 24px·아래 108px, 아이런은 원격지원과 같은 오른쪽 끝(24px)·아래 40px */
  .proto-remote{position:fixed;right:24px;bottom:108px;z-index:10000000;width:170px;height:72px;cursor:pointer;
    background:url("https://hunetdown.cdn.hunet.co.kr/Resources/HunetDev/HRD_DEV/Images/edu/common/ico/remote.png") center/cover no-repeat}

  /* ---------- 원본 버튼 값 ---------- */
  #ilearn-fab{position:fixed;right:24px;bottom:40px;z-index:999999999}
  #ilearn-fab .shell{position:relative;border-radius:30px}
  #ilearn-fab .btn{position:relative;z-index:1;display:flex;flex-direction:row-reverse;align-items:center;overflow:hidden;box-sizing:border-box;
    margin:0;padding:0;border:none;border-radius:30px;background:transparent;cursor:pointer;
    box-shadow:2px 12px 40px 0 rgba(119,73,244,.5);transition:transform .15s ease}
  #ilearn-fab .icon{position:relative;display:flex;align-items:center;justify-content:center;flex:none;width:60px;height:60px;
    border-radius:9999px;background:#7749F4;pointer-events:none;overflow:hidden}
  /* 로고: 아이런 아이콘 소스(260811_시안2_수정)에서 추출한 마크를 흰색으로 */
  #ilearn-fab .icon img{position:relative;width:30px;height:30px}
  #ilearn-fab .tip{overflow:hidden;white-space:nowrap;width:0;height:60px;box-sizing:border-box;display:flex;align-items:center;
    background:#fff;border:0 solid #E1E2E4;border-right:0;border-radius:30px 0 0 30px;transition:width .3s}
  #ilearn-fab .tip p{margin:0;padding:0 20px;font:500 16px/normal "Noto Sans KR",sans-serif;letter-spacing:-.2px;color:#000}
  #ilearn-fab .btn:hover .tip{border-width:1px}

  /* ---------- 시안 공통: 테두리 고리 · 글로우 (호버 때만 켜짐) ---------- */
  @property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
  @property --flow{syntax:"<percentage>";inherits:false;initial-value:0%}
  .c1 #ilearn-fab .ring,.c2 #ilearn-fab .ring,
  .c1 #ilearn-fab .glow,.c2 #ilearn-fab .glow{position:absolute;inset:0;border-radius:30px;pointer-events:none}
  .c1 #ilearn-fab .ring,.c2 #ilearn-fab .ring{z-index:2;padding:1.5px;opacity:0;transition:opacity .25s;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
    background:linear-gradient(90deg,#86A4F3,#9E76EE,#86A4F3,#9E76EE) var(--flow) 0/300% 100%;animation:flow 3s linear infinite}
  .c1 #ilearn-fab .glow,.c2 #ilearn-fab .glow{z-index:0;opacity:0;transition:opacity .25s;
    background:linear-gradient(90deg,#86A4F3,#9E76EE);filter:blur(8px)}
  @keyframes flow{to{--flow:300%}}
  .c1 #ilearn-fab .shell:hover .ring,.c2 #ilearn-fab .shell:hover .ring{opacity:1}
  .c1 #ilearn-fab .shell:hover .glow,.c2 #ilearn-fab .shell:hover .glow{opacity:.38}
  /* 호버 땐 원래 보라 그림자 대신 글로우가 그 역할 */
  .c1 #ilearn-fab .shell:hover .btn,.c2 #ilearn-fab .shell:hover .btn{box-shadow:none}
  /* 누름: 살짝 눌림 (어두워지는 효과는 쓰지 않음) */
  .c1 #ilearn-fab .shell:active .btn,.c2 #ilearn-fab .shell:active .btn{transform:scale(.97)}
  .c1 #ilearn-fab .shell:active .ring,.c2 #ilearn-fab .shell:active .ring,
  .c1 #ilearn-fab .shell:active .glow,.c2 #ilearn-fab .shell:active .glow{transform:scale(.97)}

  /* ---------- 시안1 샤인 스윕 ---------- */
  /* 대기: 보라 원 위로 옅은 빛이 가끔 지나감 */
  .c1 #ilearn-fab .shine{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%) -120% 0/250% 100% no-repeat;
    animation:sweep 4.5s ease-in-out infinite}
  @keyframes sweep{0%,55%{background-position:-120% 0}85%,100%{background-position:220% 0}}
  .c1 #ilearn-fab .shell:hover .shine{animation-play-state:paused;opacity:0}
  /* 누름: 글로우가 한 번 번쩍 */
  .c1 #ilearn-fab .shell.flash .glow{animation:flash .45s ease-out}
  @keyframes flash{0%{opacity:.85;filter:blur(12px)}100%{opacity:.38;filter:blur(8px)}}

  /* ---------- 시안2 회전 링 ---------- */
  /* 대기: 원 테두리를 따라 컬러 빛 한 줄기가 돎 (양끝은 흐려짐) */
  /* 원이 보라색이라 빛이 묻히지 않게, 원에서 2px 띄운 바깥 고리로 돎 */
  .c2 #ilearn-fab .comet{position:absolute;top:-4px;right:-4px;z-index:2;width:68px;height:68px;box-sizing:border-box;
    border-radius:50%;padding:2px;pointer-events:none;
    background:conic-gradient(from var(--ang),transparent 0 62%,rgba(134,164,243,.0) 62%,#86A4F3 80%,#9E76EE 92%,transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
    animation:spin 2.8s linear infinite;transition:opacity .2s}
  @keyframes spin{to{--ang:360deg}}
  .c2 #ilearn-fab .shell:hover .comet{opacity:0}
  /* 누름: 바깥 글로우는 끄고 안쪽에서 빛이 차오름 */
  .c2 #ilearn-fab .shell:active .glow{opacity:0}
  .c2 #ilearn-fab .shell:active .btn{box-shadow:inset 0 0 14px rgba(158,118,238,.55),inset 0 0 6px rgba(134,164,243,.6)}
  .c2 #ilearn-fab .shell:active .tip{box-shadow:inset 0 0 14px rgba(158,118,238,.45)}

  /* 시안 전용 요소는 원본에선 숨김 */
  .c0 #ilearn-fab .ring,.c0 #ilearn-fab .glow,.c0 #ilearn-fab .shine,.c0 #ilearn-fab .comet,
  .c2 #ilearn-fab .shine,.c1 #ilearn-fab .comet{display:none}

  /* 시안 이름표 (단독으로 열었을 때만) */
  .proto-label{position:fixed;left:16px;bottom:16px;z-index:1000000000;padding:6px 12px;border-radius:8px;
    background:rgba(0,0,0,.72);color:#fff;font:500 13px "Noto Sans KR",sans-serif}
  .proto-label a{color:#fff;opacity:.6;margin-left:8px;text-decoration:none}
  .proto-label a.on{opacity:1;text-decoration:underline}
  .embed .proto-label{display:none}
  /* 팝업이 막혔을 때 대신 띄우는 창 — 실제 팝업과 같은 폭·자리(오른쪽 위) */
  #ilearn-popup-fallback{position:fixed;top:0;right:0;z-index:2147483646;width:min(780px,100vw);background:#fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.25)}
  #ilearn-popup-fallback iframe{display:block;width:100%;height:100%;border:0}
  #ilearn-popup-fallback button{position:absolute;top:10px;right:12px;width:32px;height:32px;border:0;border-radius:8px;background:#F2F2F4;
    font:400 20px/32px sans-serif;color:#55555E;cursor:pointer}
</style>

<div class="proto-remote" title="원격 지원"></div>
<div id="ilearn-fab">
  <div class="shell">
    <span class="glow"></span>
    <button class="btn" type="button">
      <span class="icon"><span class="shine"></span><img src="assets/ilearn-logo-white.svg" alt=""></span>
      <span class="tip"><p>AI Tutor, iLearn과 대화해 보세요</p></span>
    </button>
    <span class="ring"></span>
    <span class="comet"></span>
  </div>
</div>
<div class="proto-label">아이런 버튼: <a href="?c=0">원본</a><a href="?c=4&fx=shadow">개선안 · 그림자 반짝</a><a href="?c=4&fx=line">개선안 · 선 반짝</a></div>
<script>
  /* 아이런 창 열기 — 실제 사이트(openChatbotPopup)와 같은 방식:
     폭 780 팝업을 브라우저 오른쪽 위에 붙여 열고, 높이는 버튼 위까지. 이미 열려 있으면 그 창에 질문만 넘김.
     팝업이 막힌 환경(미리보기 창 등)에서는 같은 크기·자리에 페이지 안 창으로 대신 띄움 */
  window.openILearn=function(message, anchor){
    var name='iLearnChatbot', width=780;
    var toolbar=window.outerHeight-window.innerHeight;
    var top=window.screenY+toolbar;
    var h=anchor?anchor.getBoundingClientRect().top-toolbar:0;
    var height=h>0?h:window.innerHeight;
    var left=window.screenX+window.innerWidth-width;
    var opt='width='+width+',height='+Math.round(height)+',top='+top+',left='+left;
    var url='ilearn-chat.html'+(message?'?q='+encodeURIComponent(message):'');
    var w=null; try{ w=window.open('',name,opt) }catch(e){}
    if(w){
      var open=false; try{ open=w.location.href!=='about:blank' }catch(e){ open=true }
      if(open){ w.focus(); if(message) w.postMessage({type:'HUNET_CHATBOT_SEND_MESSAGE',data:{message:message}},'*'); }
      else w=window.open(url,name,opt);
      if(w) return;
    }
    // 대신 띄우기
    var box=document.getElementById('ilearn-popup-fallback');
    if(!box){
      box=document.createElement('div'); box.id='ilearn-popup-fallback';
      box.innerHTML='<iframe title="iLearn"></iframe><button type="button" aria-label="아이런 창 닫기">×</button>';
      box.querySelector('button').onclick=function(){box.remove()};
      document.body.appendChild(box);
      box.querySelector('iframe').src=url;
    } else if(message){ box.querySelector('iframe').contentWindow.postMessage({type:'HUNET_CHATBOT_SEND_MESSAGE',data:{message:message}},'*') }
    box.style.height=Math.round(anchor?Math.max(anchor.getBoundingClientRect().top-8,320):window.innerHeight*.8)+'px';
  };
  (function(){
    var q=new URLSearchParams(location.search), c=q.get('c')||'0';
    if(!/^[0-4]$/.test(c)) c='0';
    document.documentElement.classList.add('c'+c);
    if(q.has('embed')) document.documentElement.classList.add('embed');
    var fxq=q.get('fx')||(c==='4'?'shadow':''); document.querySelectorAll('.proto-label a').forEach(function(a){ var h=a.getAttribute('href'); if(h==='?c='+c+(fxq?'&fx='+fxq:'')||h==='?c='+c) a.classList.add('on') });

    var shell=document.querySelector('#ilearn-fab .shell'), btn=shell.querySelector('.btn'), tip=btn.querySelector('.tip');
    // 원본처럼: 호버 시 말풍선 폭을 글자 길이만큼 펼침
    shell.addEventListener('mouseenter',function(){tip.style.width=(tip.querySelector('p').scrollWidth+2)+'px'});
    shell.addEventListener('mouseleave',function(){tip.style.width='0'});
    btn.addEventListener('click',function(){ window.openILearn('', btn) });
    // 시안1 누름 글로우 번쩍
    btn.addEventListener('mousedown',function(){shell.classList.remove('flash');void shell.offsetWidth;shell.classList.add('flash')});
  })();
</script>
<!-- ===== /플로팅 버튼 ===== -->
<!-- ===== 아이런 개선안 — 흰 바탕 한 덩어리 캡슐 (주소 ?c=4) =====
     원칙: 말풍선을 따로 두지 않고 캡슐 안 글자가 바뀜 · 움직임은 글자 바뀌는 순간 하나 · 그러데이션 테두리 없음
     &bg=색 을 붙이면 버튼 뒤에 그 색 판을 깔아 진한 퀵메뉴 위에서 어떻게 보이는지 확인 -->
<style>
  .c4 #ilearn-fab{display:none}

  /* 실제 사이트 아이런 버튼과 같은 자리(오른쪽 24px·아래 40px) → 원격지원과 오른쪽 끝이 맞음 */
  .v2{position:fixed;right:24px;bottom:40px;z-index:999999999;font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.5px;   /* HDS 서체 */
    --ink:#1B1A22;--sub:#6E6A80;--il:#7749F4}
  .v2 *{box-sizing:border-box}
  :where(.v2) button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

  /* ---------- 캡슐 ---------- */
  .v2-cap{position:relative;display:flex;align-items:center;gap:10px;height:60px;padding:0 14px 0 14px;border-radius:30px;cursor:pointer;
    transition:transform .25s cubic-bezier(.3,.7,.3,1),box-shadow .25s,border-color .25s,background-color .25s}
  .v2-cap:hover{transform:translateY(-2px)}
  .v2-cap:active{transform:scale(.97)}
  .v2-logo{flex:none;width:30px;height:30px;display:block;overflow:visible}
  /* 글자 칸: 폭은 다음 문구 길이에 맞춰 부드럽게 늘고 줄어듦, 글자는 위로 넘어감 */
  .v2-txt{position:relative;height:26px;overflow:hidden;transition:width .45s cubic-bezier(.3,.7,.3,1)}
  .v2-cap{transition:transform .25s cubic-bezier(.3,.7,.3,1),box-shadow .25s,border-color .25s,background-color .25s,padding .55s cubic-bezier(.3,.7,.2,1),gap .55s cubic-bezier(.3,.7,.2,1)}
  .v2-txt{transition:width .55s cubic-bezier(.3,.7,.2,1)}
  .v2.collapsed .v2-cap{padding:0 14px;gap:0}   /* 접힌 원 = 60×60, 원격지원 원과 같은 크기 */
  .v2-txt span.name{transition:transform .45s cubic-bezier(.3,.7,.3,1),opacity .45s ease .12s}
  /* 닫을 때: 글자를 오른쪽 끝에 붙여 왼쪽부터 지워지며 오른쪽으로 접힘 */
  .v2.collapsed .v2-txt span{left:auto;right:0;opacity:0;transform:translateX(8px)}
  .v2-txt span{position:absolute;left:0;top:0;white-space:nowrap;font-size:15px;line-height:26px;font-weight:500;
    transition:transform .45s cubic-bezier(.3,.7,.3,1),opacity .35s}
  .v2-txt span.name{font-weight:700}
  .v2-txt span.name em{font-style:normal;font-weight:500;opacity:.6;margin-right:5px}
  /* 문구 닫기 — HDS button-ghost-icon sm(icon-16) · 회색 대신 black-100 에 투명도(45% → 호버 85%), 호버 배경은 어두운 딤 */
  .v2-x{flex:none;display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin-left:-2px;border-radius:900px;color:#171719;opacity:.45;transition:background-color .15s,opacity .15s}
  .v2-x svg{width:16px;height:16px;display:block}
  .v2-x:hover{background:rgba(23,23,25,.06);opacity:.85}
  .v2-x:active{background:rgba(23,23,25,.1);opacity:1}
  .v2-x:focus-visible{outline:2px solid var(--il);outline-offset:1px}
  .v2.collapsed .v2-x{display:none}

  /* ---------- 일렁임 (기본·고정): 흰 바탕 안에서 분홍·연보라·하늘 빛이 천천히 흐르고, 아래로 같은 색이 은은하게 번짐 ---------- */
  @property --ix1{syntax:"<percentage>";inherits:false;initial-value:20%}
  @property --iy1{syntax:"<percentage>";inherits:false;initial-value:85%}
  @property --ix2{syntax:"<percentage>";inherits:false;initial-value:85%}
  @property --iy2{syntax:"<percentage>";inherits:false;initial-value:20%}
  @property --ix3{syntax:"<percentage>";inherits:false;initial-value:50%}
  .v2-sheen{display:none;position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
  .v2-sheen::before{content:"";position:absolute;inset:0;
    background:
      radial-gradient(48% 120% at var(--ix1) var(--iy1),rgba(244,186,236,.3),transparent 72%),
      radial-gradient(46% 120% at var(--ix2) var(--iy2),rgba(176,200,255,.3),transparent 72%),
      radial-gradient(40% 110% at var(--ix3) 50%,rgba(214,198,255,.24),transparent 70%);
    animation:v2iris 9s ease-in-out infinite alternate;
    /* 가운데는 하얗게 비우고 양 끝에서만 색이 일렁임 */
    -webkit-mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.55) 18%,transparent 34%,transparent 66%,rgba(0,0,0,.55) 82%,#000 100%);
            mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.55) 18%,transparent 34%,transparent 66%,rgba(0,0,0,.55) 82%,#000 100%)}
  @keyframes v2iris{
    0%{--ix1:15%;--iy1:90%;--ix2:88%;--iy2:15%;--ix3:45%}
    35%{--ix1:45%;--iy1:70%;--ix2:60%;--iy2:35%;--ix3:80%}
    70%{--ix1:80%;--iy1:95%;--ix2:25%;--iy2:20%;--ix3:30%}
    100%{--ix1:55%;--iy1:80%;--ix2:75%;--iy2:5%;--ix3:60%}}
  .v2.fx-iris .v2-sheen{display:block}
  .v2.fx-iris .v2-cap > :not(.v2-sheen){position:relative;z-index:1}
  /* 회색 테두리 대신: 테두리는 비우고, 안쪽에 흰색 반투명 선 */
  .c4 .v2.fx-iris.fx-shadow .v2-cap,.c4 .v2.fx-iris.fx-shadow .v2-cap:hover{border-color:transparent}
  .v2.fx-iris .v2-sheen{inset:-1px}

<script>
(function(){

    // 실제 로고 바깥선: 두 판을 합친 모양의 가장자리를 각도마다 재서 씀 → 마지막에 로고와 이음매 없이 겹침
    function logoOutline(){ var svgEl=head.ownerSVGElement, pt=svgEl.createSVGPoint(), out=new Array(N);
      for(var i=0;i<N;i++){ var t=i/N*TAU, r=9.6; for(; r>2; r-=.02){ pt.x=CX+r*Math.cos(t); pt.y=CY+r*Math.sin(t); if(pa.isPointInFill(pt)||pb.isPointInFill(pt)) break; } out[i]=r }
      return soften(out,1) }
    // 레퍼런스처럼 모서리를 말랑하게: 이웃 값을 넓게 평균 내 둥글림
    // 실제 로고의 빈 구멍(흰 페이지): 가운데서 바깥으로 나가며 처음 판에 닿는 거리 → 끝에서 구멍이 서서히 열림
    function logoHole(){ var svgEl=head.ownerSVGElement, pt=svgEl.createSVGPoint(), out=new Array(N);
      for(var i=0;i<N;i++){ var t=i/N*TAU, r=0; for(; r<7.5; r+=.02){ pt.x=CX+r*Math.cos(t); pt.y=CY+r*Math.sin(t); if(pa.isPointInFill(pt)||pb.isPointInFill(pt)) break; } out[i]=Math.min(r,7.5) }
      return soften(out,1) }
    var HOLE=null;
    var CIRCLE=shape(function(){return 1});
    var HEX=soften(shape(hexR(7.9)),4);                                                   // 육각형 (모서리만 살짝 둥글게, 형태가 또렷하게)
    var SPARK=soften(shape(spark),2);                                                      // 끝이 둥근 네 갈래 별 (반지름 1)
    var LOGO=null;
    function pathOf(rs,scale,rot,cx,cy,sx,sy){ sx=sx||1; sy=sy||1; var d=''; for(var i=0;i<N;i++){ var t=i/N*TAU+rot, r=rs[i]*scale; d+=(i?'L':'M')+(cx+r*Math.cos(t)*sx).toFixed(3)+' '+(cy+r*Math.sin(t)*sy).toFixed(3) } return d+'Z' }
    // 쫀득함: 모양이 완성되는 순간부터 젤리처럼 위아래로 눌렸다 늘었다 출렁이다 가라앉음 (전체 속도는 그대로)
    function jelly(t,at,amp){ var d=t-at; return d<=0?0:amp*Math.exp(-d/260)*Math.sin(d/95) }
    var sine=function(k){ return -(Math.cos(Math.PI*k)-1)/2 };
    // 모양이 완성될 때 살짝 부풀었다 가라앉는 통통함 (작게)
    function pop(t,at,amp){ var d=t-at; return d<=0?0:amp*Math.exp(-d/220)*Math.sin(d/70) }
    var g=document.getElementById('v2swirl'), c1=document.getElementById('v2c1'), c2=document.getElementById('v2c2'), c3=document.getElementById('v2c3');
    function hexToRgb(h){ var n=parseInt(h.slice(1),16); return [n>>16,n>>8&255,n&255] }
    function mixRgb(rgb,hex,k){ var x=rgb.match(/\d+/g).map(Number), y=hexToRgb(hex); return 'rgb('+x.map(function(v,i){return Math.round(v+(y[i]-v)*k)}).join(',')+')' }
    function mixC(a,b,k){ var x=hexToRgb(a),y=hexToRgb(b); return 'rgb('+x.map(function(v,i){return Math.round(v+(y[i]-v)*k)}).join(',')+')' }

    // 반짝이 별이 완성되는 순간(4568ms)에 시간을 0.45초 멈추고, 그동안 별만 '빤짝' (나머지 흐름은 그대로 뒤로 밀림)
    var TW_AT=4337, TW_LEN=450;   // 반짝이 별이 완성되는 순간 (u = 2/3)
    var T=TW_AT+260+520+500+TW_LEN+800;   // 로고가 뿅 나타나 출렁임이 가라앉을 때까지 (+ 육각형 머묾 0.8초)
    var STARS=[head.querySelector('.s1'),head.querySelector('.s2'),head.querySelector('.s3')];
    STARS.forEach(function(el){ el.style.transformBox='fill-box'; el.style.transformOrigin='center' });
    // 육각형이 완성되는 순간(3264ms)에도 0.8초 머묾 → 육각형 형태가 또렷이 보이게 (머무는 동안 천천히 돌며 숨 쉼)
    var HX_AT=3264, HX_LEN=800;
    function frame(t){
      var hx=0; if(t>=HX_AT){ if(t<HX_AT+HX_LEN){ hx=(t-HX_AT)/HX_LEN; t=HX_AT; } else t-=HX_LEN; }
      var tw=0; if(t>=TW_AT){ if(t<TW_AT+TW_LEN){ tw=(t-TW_AT)/TW_LEN; t=TW_AT; } else t-=TW_LEN; }
      // ① 점 셋: 일정한 속도의 부드러운 물결 (한 바퀴 0.9초)
      // 한 번에 쫀득하게 모임: 바깥으로 살짝 당겼다가 가운데로 휙 (0.55초)
      var gk=seg(t,1700,2250), gather=gk<=0?0:gk>=1?1:(2.2*gk*gk*gk-1.2*gk*gk);
      dots.forEach(function(d,k){
        // 물결은 실제 시계로 돎 → 되감기·빨리감기와 상관없이 늘 같은 느린 속도 (한 번 오르내리는 데 1.4초)
        var ph=performance.now()/1400*TAU-k*.9, hop=1.0*(.5-.5*Math.cos(ph))*sine(seg(t,0,700))*(1-gather);
        var x=CX+(k-1)*5.0*(1-gather)   /* 점 사이 간격 넉넉히 */, r=lerp(1.3,1.7,clamp(gather))*(1-seg(t,2350,2600));
        d.setAttribute('cx',x.toFixed(3)); d.setAttribute('cy',(CY-hop).toFixed(3)); d.setAttribute('r',Math.max(0,r).toFixed(3));
        d.setAttribute('opacity',1);
      });
      // ② 녹아 하나 → 둥근 육각형 → 쿠키 → 반짝이 → 로고 바깥선
      // 모양 변화는 한 줄기 진행값 u 하나로: 처음과 끝만 부드럽게, 가운데는 일정한 속도 (구간마다 빨라졌다 느려지는 출렁임 없음)
      var grow=sine(seg(t,2150,2650));
      var u=seg(t,2300,5450); u=(u<.12?(u*u)/.24:u>.88?.88-((1-u)*(1-u))/.24:u-.06)/.88;
      // 원→육각형은 u 0~0.28, 육각형으로 잠깐 머문 뒤(0.28~0.40) 반짝이로 (반짝이 완성은 그대로 u=2/3)
      var toHex=clamp(u/.28), toSpark=clamp((u-.40)/(2/3-.40)), toLogo=0;
      var rs=CIRCLE.map(function(){ return lerp(.2,2.9,grow) });
      rs=mix(rs,HEX,toHex); var sparkRot=0;
      // 육각형 → 반짝이: 모양을 억지로 섞지 않고, 육각형이 작게 오므라든 뒤 그 점에서 반짝이가 살짝 돌며 피어남 (끝에 아주 살짝 넘침)
      if(toSpark>0){
        if(toSpark<.5){ var kk=sine(toSpark*2); rs=HEX.map(function(v){ return v*lerp(1,.2,kk) }); }
        else { var kb=toSpark*2-1, ob=1+2.2*Math.pow(kb-1,3)+1.2*Math.pow(kb-1,2); rs=SPARK.map(function(v){ return v*8.4*lerp(.2,1,ob) }); sparkRot=(1-sine(kb))*-70*Math.PI/180; }
      }
      // ③ 반짝이 → 로고 '뿅!': 반짝이가 빤짝한 뒤 살짝 돌며 쏙 작아지고(0.26초), 그 자리에서 로고가 작게 튀어나와 크게 넘쳤다 쫀득하게 자리잡음
      var shrink=seg(t,TW_AT,TW_AT+260), POP=TW_AT+260, popK=seg(t,POP,POP+520);
      if(t>TW_AT){ rs=SPARK.map(function(v){ return v*8.4*(1-sm(shrink)) }); }
      var bump=1;
      var rot=-240*(1-Math.min(u,2/3)*1.5)*Math.PI/180+sparkRot;   // 반짝이까지 일정한 속도로 돎
      if(t>TW_AT) rot=(sm(shrink)*120)*Math.PI/180;                 // 작아질 때 한 번 휙
      var wob=jelly(t,2250,.16)+jelly(t,3264,.08);   // 모이는 순간 크게 쫀득, 육각형 완성 때 한 번 더
      // 빤짝: 별이 살짝 커졌다 돌아오며 끝을 한 번 틀고, 안쪽이 밝게 번쩍
      var flash=tw>0?Math.sin(Math.PI*tw):0, flick=tw>0?Math.sin(Math.PI*tw)*Math.exp(-tw*1.5):0;
      bump*=1+.2*flash; rot+=flick*22*Math.PI/180;
      if(tw>0) wob+=.08*Math.exp(-tw*2.5)*Math.sin(tw*9);
      // 육각형으로 머무는 동안: 천천히 60° 돌며(육각형은 60°마다 같은 모양이라 끝나도 튀지 않음) 은은하게 숨 쉬고 한 번 쫀득
      if(hx>0){ rot+=sine(hx)*60*Math.PI/180; bump*=1+.05*Math.sin(Math.PI*hx); wob+=.05*Math.sin(Math.PI*2*hx)*(1-hx); }
      var sx=1+wob, sy=1-wob;
      A.setAttribute('d', (t<1900||t>=POP)?'':pathOf(rs,bump,rot,CX,CY,sx,sy));
      var ga=t*.12;
      g.setAttribute('gradientTransform','rotate('+ga.toFixed(1)+' '+CX+' '+CY+')');
      var s1='#6A3CF0', s2='#B48BFF', s3='#7FA8FF';
      if(flash>0){ s1=mixC(s1,'#B79BFF',flash*.7); s2=mixC(s2,'#F3ECFF',flash*.85); s3=mixC(s3,'#CFE0FF',flash*.7); }
      c1.setAttribute('stop-color',s1); c2.setAttribute('stop-color',s2); c3.setAttribute('stop-color',s3);
      C.setAttribute('d',''); B.setAttribute('d','');
      // 로고 뿅: 0에서 1.18배까지 튀었다가 1로 (뒤로 살짝 당겼다 놓는 곡선) + 착지 후 젤리 출렁
      var pk=popK, pop=pk<=0?0:1+2.9*Math.pow(pk-1,3)+1.9*Math.pow(pk-1,2);
      var pw=jelly(t,POP+380,.06), psx=pop*(1+pw), psy=pop*(1-pw);
      head.style.opacity=t>=POP?1:0; fluid.setAttribute('opacity',t>=POP?0:1);
      head.style.transform='scale('+psx.toFixed(4)+','+psy.toFixed(4)+')';
      // 로고가 자리 잡으면 반짝이가 릴레이처럼 작은 별 → 중간 별 → 큰 별 순서로 톡, 톡, 톡 (겹치며 이어짐)
      STARS.forEach(function(el,k){
        var sk=seg(t,POP+340+k*120,POP+700+k*120), sp=sk<=0?0:1+2.9*Math.pow(sk-1,3)+1.9*Math.pow(sk-1,2);
        el.style.transform='scale('+sp.toFixed(4)+') rotate('+((1-sk)*-30).toFixed(1)+'deg)';
      });
      // 물방울 효과는 점이 모여 합쳐지는 동안에만 → 떨어져 있을 땐 셋 다 완전한 원
      if(gather>.3&&t<=2750) gooey.setAttribute('filter','url(#v2goo)'); else gooey.removeAttribute('filter');
    }
    /* ---- 등장 뒤 평소 움직임: 모양은 그대로, 반짝이 셋이 가끔 릴레이로 이어서 살짝 + 로고 전체가 숨 쉬듯 1px ----
       모두 고른 사인 곡선 (빨라졌다 느려지는 출렁임 없음) */
    var idleOn=false, waveT=null, waveI=null;
    var order=[head.querySelector('.s2'),head.querySelector('.s1'),head.querySelector('.s3')]; // 왼쪽부터
    order.forEach(function(el){ el.style.transformBox='fill-box'; el.style.transformOrigin='center' });
    function wave(){
      // 반짝이 릴레이: 작은 별 → 중간 별 → 큰 별이 같은 동작을 0.14초씩 겹쳐 이어받음
      var relay=[head.querySelector('.s1'),head.querySelector('.s2'),head.querySelector('.s3')];
      relay.forEach(function(el,k){
        el.animate([{transform:'scale(1) rotate(0)'},{transform:'scale(1.25) rotate(16deg)'},{transform:'scale(1) rotate(0)'}],
          {duration:900,delay:k*140,easing:'cubic-bezier(.37,0,.63,1)'});
      });
      // 마지막 큰 별 차례에 캡슐 그림자/선도 이어서 반짝
      setTimeout(function(){ box.classList.remove('shine'); void box.offsetWidth; box.classList.add('shine'); },280);
      setTimeout(function(){ box.classList.remove('shine') },3800);
    }
    function startIdle(){
      idleOn=true; waveT=setTimeout(wave,1800); waveI=setInterval(function(){ if(!box.classList.contains('open')) wave(); },5200);
      var t0=performance.now();
      (function f(now){ if(!idleOn) return;
        var y=-Math.sin((now-t0)/4000*TAU)*.55;   // 그림 단위 0.55 ≈ 1px
        head.style.transform='translateY('+y.toFixed(3)+'px)';
        requestAnimationFrame(f);
      })(t0);
    }
    function stopIdle(){ idleOn=false; clearTimeout(waveT); clearInterval(waveI); order.forEach(function(el){ el.getAnimations().forEach(function(a){a.cancel()}) }); head.style.transform=''; }

    /* ---- 순환: 로고+이름 → (로고→형태 결합→육각형→반짝임→로고) → 질문 문구 + 점 셋 대기 → 로고+이름 … ----
       gen 이 바뀌면(마우스 올림 등) 진행 중이던 움직임은 모두 그 자리에서 멈춤 */
    var gen=0;
    function later(fn,ms){ var my=gen; setTimeout(function(){ if(my===gen) fn() },ms) }
    function hold(at,dur,done){ var my=gen, t0=performance.now(); (function f(now){ if(my!==gen) return; frame(at); if(now-t0<dur) requestAnimationFrame(f); else done&&done(); })(t0) }
    function run(from,to,dur,done,ease){ var my=gen, t0=performance.now(); (function f(now){ if(my!==gen) return; var k=Math.min(1,(now-t0)/dur); frame(lerp(from,to,ease?ease(k):k)); if(k<1) requestAnimationFrame(f); else done&&done(); })(t0) }
    function showLogo(){
      head.getAnimations().forEach(function(a){a.cancel()});
      fluid.setAttribute('opacity',0); A.setAttribute('d',''); head.style.opacity=1; head.style.transform='';
      STARS.forEach(function(el){ el.style.transform='' });
    }
    // 로고가 살짝 눌렸다가 돌며 작은 덩어리로 응축 → 덩어리(형태) 상태에서 이어감
    function condense(done){
      var my=gen;
      head.animate([
        {transform:'scale(1,1) rotate(0)'},
        {transform:'scale(1.08,.9) rotate(4deg)',offset:.22},
        {transform:'scale(.2,.2) rotate(-50deg)'}
      ],{duration:550,easing:'cubic-bezier(.55,0,.75,.2)',fill:'forwards'}).finished.then(function(){
        if(my!==gen) return;
        head.getAnimations().forEach(function(a){a.cancel()});
        fluid.setAttribute('opacity',1); frame(2250); done();
      },function(){});
    }
    var qi=0, closed=false;
    var LOGO_MS=5000;                                                                                  // 로고 모양으로 머무는 시간 (넉넉히)
    function accel(k){ return k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2 }                                      // 완만한 가속 → 감속
    // 로고 → 형태 결합 → 육각형 → 반짝임 → 로고 (예전보다 조금 빠르게, 완만한 가속)
    function morph(next){ stopIdle(); condense(function(){ run(2250,T,(T-2250)*.85,function(){ showLogo(); startIdle(); next() },accel) }) }
    function rest(){ showLogo(); setText(NAME,''); startIdle(); later(function(){ morph(function(){ later(ask,2600) }) },LOGO_MS) }   // 로고 + 이름
    function restClosed(){ showLogo(); startIdle(); later(function(){ morph(restClosed) },LOGO_MS) }  // 닫은 뒤: 동그란 버튼 안에서 로고 모양 순환만
    function ask(){                                                                                   // 질문 문구 + 점 셋 대기
      stopIdle(); var q=QS[qi]; qi=(qi+1)%QS.length;
      setText({text:q},q);
      condense(function(){ run(2250,1700,600,function(){ hold(1700,4800,back) },accel) });
    }
    function back(){                                                                                  // 점 셋이 모여 로고로 톡
      setText(NAME,'');
      run(1700,2250,450,function(){
        showLogo();
        head.animate([{transform:'scale(.2)'},{transform:'scale(1.14)',offset:.6},{transform:'scale(1)'}],{duration:520,easing:'cubic-bezier(.34,1.3,.64,1)'});
        later(rest,520);
      },accel);
    }
    window.v2Close=function(){
      closed=true; gen++; stopIdle(); showLogo(); setText(NAME,'');
      box.classList.add('collapsed'); wrap.style.width='0px';
      later(restClosed,600);
    };
    window.v2Hover=function(on){
      gen++; stopIdle(); showLogo(); if(!closed) setText(NAME,'');
      if(on) startIdle(); else later(closed?restClosed:rest,0);
    };
    if(!LOGO){ LOGO=logoOutline(); HOLE=logoHole(); }
    showLogo(); setTimeout(rest,300);   // 처음엔 로고 + 이름으로 시작
  })();
})();
</script>

<script>
  // 들어가야 할 가장 큰 크기(물어볼 거리 목록 + 가장 긴 문구 캡슐, 기존 버튼은 펼친 말풍선) 기준으로 배율 계산
  (function(){
    function fit(){
      var needW=360, needH=300;                       // 개선안: 가장 긴 문구 캡슐 폭 ≈ 330, 목록+캡슐 높이 ≈ 290
      if(!document.getElementById('v2')) { needW=360; needH=110; }   // 기존 버튼: 펼친 말풍선 폭 ≈ 330
      var k=Math.min(2, (innerWidth*.9)/needW, (innerHeight*.82)/needH);
      document.documentElement.style.setProperty('--k', Math.max(.8,k).toFixed(3));
    }
    fit(); addEventListener('resize',fit);
    var cap=document.getElementById('v2cap');
    function half(){ if(cap) document.documentElement.style.setProperty('--half',(cap.offsetWidth/2)+'px') }
    half(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(half);
    // 폭이 바뀌는 동안은 그대로 두었다가, 멈추고 0.1초 뒤 가운데로
    var settle; if(cap&&window.ResizeObserver) new ResizeObserver(function(){ clearTimeout(settle); settle=setTimeout(half,100) }).observe(cap);
  })();
</script>
