<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iLearn 버튼 수정안</title>
<!-- 화면만: 위 막대·오른쪽 조정판 없이 연수원 메인 화면 위에 수정안 버튼만 (창 크기 그대로).
     값은 index.html 의 기본값(조정판에서 확정한 값) 그대로 — 보는 사람 브라우저에 저장된 조정값은 쓰지 않음.
     위 막대가 있는 보기 전용은 present.html -->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style></head>
<body>
<iframe title="iLearn 버튼 수정안 — 연수원 메인 화면 위"></iframe>
<script>
  // clean.html?invert → 컬러 반전 (주소 뒤 옵션을 그대로 넘김)
  var q=location.search.replace(/^\?/,'');
  document.querySelector('iframe').src='index.html?present&clean'+(q?'&'+q:'');
</script>
</body></html>
