<style>
  /* HDS 토큰 (andy-room/hds 기준, 라이트 고정) */
  :root{
    --font-default:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; --font-number:'SUIT','Pretendard',sans-serif;
    --text-12:12px; --text-14:14px; --text-16:16px; --text-18:18px; --text-20:20px; --text-48:48px;
    --leading-body:1.6; --leading-heading:1.4;
    --tracking-12:-0.0417em; --tracking-14:-0.0357em; --tracking-16:-0.0313em; --tracking-18:-0.0278em; --tracking-20:-0.035em; --tracking-48:-0.0146em;
    --spacing-1:4px; --spacing-2:8px; --spacing-3:12px; --spacing-4:16px; --spacing-5:20px; --spacing-6:24px; --spacing-8:32px; --spacing-10:40px;
    --radius-md:8px; --radius-lg:16px; --radius-xl:20px; --radius-full:9999px;
    --shadow-lg:0px 4px 4px -4px rgba(0,0,0,.05),0px 16px 32px -4px rgba(0,0,0,.1);
    --brand-hunet-red:#FA2E43;
    --bg-surface:#FFFFFF; --bg-page:#F7F7F8; --bg-strong:#F4F4F5; --bg-muted:#EAEBEC;
    --line-layout:#E1E2E4;
    --typography-black-100:#171719; --typography-black-80:rgba(23,23,25,.8); --typography-black-60:rgba(23,23,25,.6); --typography-black-45:rgba(23,23,25,.45);
    --typography-white-100:#FFFFFF; --typography-white-60:rgba(255,255,255,.6);
    /* 스킬 컬러 (히어로 팔레트) */
    --sk-data:#00BF40; --sk-comm:#0066FF; --sk-solve:#FF9200; --sk-lead:#6541F2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg-page);color:var(--typography-black-100);font-family:var(--font-default);-webkit-font-smoothing:antialiased;word-break:keep-all}
  .num{font-family:var(--font-number)}

  /* ===== 시안 전환 바 ===== */
  .bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:var(--spacing-4);padding:var(--spacing-3) var(--spacing-5);background:rgba(247,247,248,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-layout)}
  .seg{display:inline-flex;padding:4px;border-radius:var(--radius-full);background:var(--bg-muted)}
  .seg button{border:0;background:none;padding:var(--spacing-2) var(--spacing-5);border-radius:var(--radius-full);font:500 var(--text-14)/1.4 var(--font-default);letter-spacing:var(--tracking-14);color:var(--typography-black-60);cursor:pointer}
  .seg button[aria-selected=true]{background:var(--bg-surface);color:var(--typography-black-100);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .bar small{font-size:var(--text-12);color:var(--typography-black-45)}

  /* ===== 섹션 (Figma 57:5281) ===== */
  .next{padding:200px 0 100px}
  .wrap{max-width:1344px;margin:0 auto;padding:0 var(--spacing-8)}
  .hd{text-align:center}
  .eyebrow{margin:0;font-size:var(--text-20);font-weight:500;line-height:var(--leading-heading);letter-spacing:var(--tracking-20);color:var(--brand-hunet-red)}
  .hd h2{margin:var(--spacing-3) 0 0;font-size:var(--text-48);font-weight:700;line-height:var(--leading-heading);letter-spacing:var(--tracking-48)}
  .hd p.lead{margin:var(--spacing-10) 0 0;font-size:var(--text-18);line-height:var(--leading-body);letter-spacing:var(--tracking-18);color:var(--typography-black-80)}
  .stage{margin-top:130px}
  .stage[hidden]{display:none}

  /* 썸네일 카드 공통 */
  .card{position:relative;display:block;aspect-ratio:305/171.56;border-radius:22px;overflow:visible;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s,filter .5s,box-shadow .5s}
  .card img{display:block;width:100%;height:100%;object-fit:cover;border-radius:22px}
  .chip{position:absolute;left:50%;bottom:-14px;z-index:3;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-full);background:var(--typography-black-100);color:var(--typography-white-100);font-size:var(--text-12);font-weight:500;letter-spacing:var(--tracking-12);white-space:nowrap;transform:translate(-50%,6px);opacity:0;transition:opacity .35s,transform .35s;pointer-events:none}
  .chip i{width:7px;height:7px;border-radius:50%;background:var(--c,#fff)}
  .chip b{font-family:var(--font-number);font-weight:600;color:var(--c,#fff)}

  /* ===== A. 스킬 매치 보드 ===== */
  .va{position:relative;display:grid;grid-template-columns:300px 1fr;gap:80px;align-items:start}
  .me{position:relative;z-index:2;padding:var(--spacing-6);border-radius:var(--radius-xl);background:var(--bg-surface);box-shadow:var(--shadow-lg)}
  .who{display:flex;align-items:center;gap:var(--spacing-3);padding-bottom:var(--spacing-5);border-bottom:1px solid var(--line-layout)}
  .who .av{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--typography-black-100);color:#fff;font-weight:700}
  .who b{display:block;font-size:var(--text-16);letter-spacing:var(--tracking-16)}
  .who small{display:block;font-size:var(--text-12);color:var(--typography-black-60);letter-spacing:var(--tracking-12)}
  .me .cap{margin:var(--spacing-5) 0 var(--spacing-2);font-size:var(--text-12);color:var(--typography-black-45);letter-spacing:var(--tracking-12)}
  .sk{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px var(--spacing-2);width:100%;margin:0 0 var(--spacing-2);padding:var(--spacing-3);border:1px solid transparent;border-radius:var(--radius-md);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:background .3s,border-color .3s}
  .sk:hover{background:var(--bg-strong)}
  .sk .nm{font-size:var(--text-14);font-weight:600;letter-spacing:var(--tracking-14)}
  .sk .pc{font-family:var(--font-number);font-size:var(--text-14);font-weight:600;color:var(--typography-black-60)}
  .sk .meter{grid-column:1/-1;height:4px;border-radius:4px;background:var(--bg-muted);overflow:hidden}
  .sk .meter i{display:block;height:100%;background:var(--c);border-radius:4px}
  .sk .dot{position:absolute;right:-31px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--c);opacity:0;transition:opacity .3s}
  .sk.on{background:var(--bg-surface);border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent)}
  .sk.on .pc{color:var(--c)} .sk.on .dot{opacity:1}
  .me .hint{margin:var(--spacing-3) 0 0;font-size:var(--text-12);color:var(--typography-black-45);letter-spacing:var(--tracking-12)}
  .ga{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;height:640px;overflow:hidden;padding:8px 8px 0;margin:-8px -8px 0;-webkit-mask-image:linear-gradient(#000 90%,transparent);mask-image:linear-gradient(#000 90%,transparent)}
  .ga .colm{display:flex;flex-direction:column;gap:20px}
  .ga .colm:nth-child(1){padding-top:50px} .ga .colm:nth-child(3){padding-top:60px}
  .va .card{overflow:visible}
  .va .chip{font-size:11px;padding:5px 10px}
  .va.active .card{opacity:.32;filter:grayscale(.7)}

const SKILL_COLOR = { data:'var(--sk-data)', comm:'var(--sk-comm)', solve:'var(--sk-solve)', lead:'var(--sk-lead)' };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const card = (i, extraChip) => {
  const c = C[i];
  return `<figure class="card" data-i="${i}" data-skill="${c.skill}" style="--c:${SKILL_COLOR[c.skill]};margin:0">
    <img src="${c.img}" alt="${c.title}" loading="lazy">
    <span class="chip"><i></i>${extraChip ? 'AI 추천 · ' : ''}${c.label} <b>+${c.pt}</b></span></figure>`;
};

/* ---------- 시안 전환 ---------- */
const tabs = [...document.querySelectorAll('.seg button')];
function show(v){
  tabs.forEach(t => t.setAttribute('aria-selected', t.dataset.v === v));
  document.getElementById('va').hidden = v !== 'a';
  document.getElementById('vc').hidden = v !== 'c';
  history.replaceState(null, '', '#' + v);
  if(v === 'a') A.redraw();
}
tabs.forEach(t => t.onclick = () => show(t.dataset.v));
addEventListener('keydown', e => { if(e.key === '1') show('a'); if(e.key === '2') show('c'); });

/* ---------- A. 스킬 매치 보드 ---------- */
const A = (() => {
  // Figma 4열 엇갈림 배치 그대로 (크기만 줄임)
  const COLS = [[0,4,8], [1,5,9,13], [2,6,10], [3,7,11,12]];
  const ga = document.getElementById('ga');
  ga.innerHTML = COLS.map(col => `<div class="colm">${col.map(i => card(i)).join('')}</div>`).join('');
  const board = document.querySelector('.va'), svg = board.querySelector('.links');
  const skills = [...board.querySelectorAll('.sk')], cards = [...ga.querySelectorAll('.card')];
  let cur = null, timer = 0, hold = 0;

  function select(skill){
    cur = skill;
    board.classList.toggle('active', !!skill);
    skills.forEach(b => b.classList.toggle('on', b.dataset.skill === skill));
    cards.forEach(c => c.classList.toggle('on', c.dataset.skill === skill && visibleIn(c)));
    redraw(true);
  }
  // 그리드 안에서 보이는 카드만 연결
  function visibleIn(c){ const g = ga.getBoundingClientRect(), r = c.getBoundingClientRect(); return r.top >= g.top - 2 && r.bottom <= g.bottom - 10; }
  function redraw(animate){
    if(!cur || getComputedStyle(svg).display === 'none'){ svg.innerHTML = ''; return; }
    const b = board.getBoundingClientRect(), btn = skills.find(s => s.dataset.skill === cur), dot = btn.querySelector('.dot').getBoundingClientRect();
    const x1 = dot.left + dot.width / 2 - b.left, y1 = dot.top + dot.height / 2 - b.top, color = getComputedStyle(btn).getPropertyValue('--c');
    svg.innerHTML = cards.filter(c => c.classList.contains('on')).map(c => {
      const r = c.getBoundingClientRect(), x2 = r.left - b.left - 4, y2 = r.top + r.height / 2 - b.top, mx = (x1 + x2) / 2;
      return `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" stroke="${color}"/><circle cx="${x2}" cy="${y2}" r="4" fill="${color}"/>`;
    }).join('');
    if(animate && !reduce) svg.querySelectorAll('path').forEach((p, k) => {
      const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
      p.getBoundingClientRect(); p.style.transition = `stroke-dashoffset .7s cubic-bezier(.4,0,.2,1) ${k * .12}s`; p.style.strokeDashoffset = 0;
    });
  }
  // 자동 순환 (사용자가 누르면 10초 멈춤)
  const order = skills.map(s => s.dataset.skill);
  function tick(){ if(Date.now() < hold || document.getElementById('va').hidden) return; select(order[(order.indexOf(cur) + 1) % order.length]); }
  skills.forEach(s => s.onclick = () => { hold = Date.now() + 10000; select(s.dataset.skill); });
  addEventListener('resize', () => redraw(false));
  setTimeout(() => select(order[0]), 400);
  if(!reduce) timer = setInterval(tick, 3600);
  return { redraw:() => setTimeout(() => redraw(true), 30) };
})();

/* ---------- C. 흐르는 피드 + AI 렌즈 ---------- */
(() => {
  // Figma 4열 배치: 열별 콘텐츠와 시작 오프셋(50 / 0 / 60 / 0)
  const COLS = [[0,4,8], [1,5,9,13], [2,6,10], [3,7,11,12]], OFF = [50, 0, 60, 0], DIR = [-1, 1, -1, 1], SPEED = 16;
  const root = document.getElementById('cols'), box = document.getElementById('vcBox');
  root.innerHTML = COLS.map(col => `<div class="colc"><div class="track">${[...col, ...col, ...col].map(i => card(i, true)).join('')}</div></div>`).join('');
  const tracks = [...root.querySelectorAll('.track')].map((el, k) => ({ el, k, y:0, paused:false, loop:0 }));
  const measure = () => tracks.forEach(t => { const n = COLS[t.k].length, c = t.el.children; t.loop = c[n].offsetTop - c[0].offsetTop; });
  let last = performance.now(), hover = false;
  box.onmouseenter = () => hover = true; box.onmouseleave = () => hover = false;
  function frame(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if(!document.getElementById('vc').hidden){
      if(!tracks[0].loop) measure();
      for(const t of tracks){
        if(!hover && !t.paused && !reduce) t.y += DIR[t.k] * SPEED * dt;
        const m = ((t.y % t.loop) + t.loop) % t.loop;          // 0 ~ loop 반복
        t.el.style.transform = `translateY(${OFF[t.k] - t.loop + m}px)`;
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  addEventListener('resize', measure);

  // AI 렌즈: 가운데 띠를 지나는 카드 하나를 집어 추천
  let lensT = null;
  function lens(){
    if(document.getElementById('vc').hidden || hover) return;
    const b = box.getBoundingClientRect(), mid = b.top + b.height * .5;
    const cand = [...root.querySelectorAll('.card')].filter(c => {
      if(c.offsetParent === null) return false;
      const r = c.getBoundingClientRect(); return Math.abs(r.top + r.height / 2 - mid) < b.height * .18 && r.left >= b.left;
    });
    if(!cand.length) return;
    const pick = cand[Math.floor(Math.random() * cand.length)], t = tracks.find(t => t.el.contains(pick));
    box.classList.add('dim'); pick.classList.add('lens'); t.paused = true;
    clearTimeout(lensT);
    lensT = setTimeout(() => { pick.classList.remove('lens'); box.classList.remove('dim'); t.paused = false; }, 2300);
  }
  setTimeout(lens, 900);
  setInterval(lens, 3200);
})();

show(location.hash === '#c' ? 'c' : 'a');
</script>
