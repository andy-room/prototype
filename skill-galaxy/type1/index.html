<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HU 스킬 갤럭시</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style id="hds-critical-tokens">
  /* HDS — Hunet Design System (colors_and_type.css 기준, 라이트 고정) */
  :root{
    --font-sans:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --font-display:"SUIT","Pretendard Variable","Pretendard",system-ui,sans-serif;
    --fg-100:#171719; --fg-80:rgba(23,23,25,.80); --fg-60:rgba(23,23,25,.60); --fg-45:rgba(23,23,25,.45); --fg-disable:#AEB0B6;
    --bg-primary:#FFFFFF; --bg-alternative:#F7F7F8; --bg-dim:rgba(0,0,0,.45);
    --bg-theme-200:#F7F7F8; --bg-theme-300:#EAEBEC; --bg-theme-400:#E1E2E4;
    --line-layout:#EAEBEC; --line-outline:#E1E2E4; --line-strong:#C2C4C8; --line-bold:#171719;
    --brand-company-primary:#0066FF; --brand-company-strong:#0052CC; --brand-company-muted:#99C2FF; --brand-company-faint:#CCE0FF; --brand-company-ghost:#EBF3FF;
    --interaction-button-subtle:#F4F4F5; --interaction-selected:#0066FF; --interaction-selected-bg:#EBF3FF; --interaction-selected-outline:#99C2FF;
    --role-hover:rgba(0,0,0,.05); --role-pressed:rgba(0,0,0,.10);
    --sp-1:2px; --sp-2:4px; --sp-3:6px; --sp-4:8px; --sp-6:12px; --sp-8:16px; --sp-10:20px; --sp-12:24px; --sp-16:32px; --sp-20:40px;
    --radius-xs:4px; --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:20px; --radius-full:900px;
    --shadow-sm:0 1px 4px 0 rgba(0,0,0,.05),0 4px 8px 0 rgba(0,0,0,.05);
    --shadow-xl:0 2px 8px 0 rgba(0,0,0,.05),0 16px 32px 0 rgba(0,0,0,.10);
    --tracking-tight:-0.7px; --tracking-normal:-0.5px; --lh-tight:1.4; --lh-body:1.6;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg-alternative);color:var(--fg-100);font-family:var(--font-sans);letter-spacing:var(--tracking-normal);-webkit-font-smoothing:antialiased;word-break:keep-all}
  button,input{font:inherit;color:inherit;letter-spacing:inherit}
  .num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
  .ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .ico.s16{width:16px;height:16px}

  /* ===== GNB ===== */
  .gnb{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:var(--sp-12);padding:0 var(--sp-16);background:var(--bg-primary);border-bottom:1px solid var(--line-layout)}
  .logo{display:flex;align-items:center;gap:var(--sp-4);font-weight:700;font-size:18px;text-decoration:none;color:var(--fg-100)}
  .logo b{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--radius-sm);background:var(--brand-company-primary);color:#fff;font-size:14px}
  .search{position:relative;flex:1;max-width:480px;margin:0 auto}
  .search input{width:100%;height:40px;padding:0 var(--sp-8) 0 40px;border:1px solid var(--line-outline);border-radius:var(--radius-sm);background:var(--bg-alternative);font-size:14px;outline:none;transition:border-color .15s,background .15s}
  .search input:focus{border-color:var(--interaction-selected-outline);background:var(--bg-primary)}
  .search>.ico{position:absolute;left:12px;top:10px;color:var(--fg-45)}
  .suggest{position:absolute;top:44px;left:0;right:0;max-height:360px;overflow:auto;margin:0;padding:var(--sp-4);list-style:none;background:var(--bg-primary);border:1px solid var(--line-outline);border-radius:var(--radius-sm);box-shadow:var(--shadow-xl)}
  .suggest[hidden]{display:none}
  .suggest li{display:flex;justify-content:space-between;gap:var(--sp-6);padding:var(--sp-4) var(--sp-6);border-radius:var(--radius-xs);font-size:14px;cursor:pointer}
  .suggest li[aria-selected=true],.suggest li:hover{background:var(--role-hover)}
  .suggest li small{color:var(--fg-45);font-size:12px;white-space:nowrap}
  .suggest .empty{color:var(--fg-45);cursor:default}
  .gnb .stat{font-size:14px;color:var(--fg-60);white-space:nowrap}
  .gnb .stat b{color:var(--fg-100);font-weight:700}

  /* ===== Layout ===== */
  .main{display:grid;grid-template-columns:minmax(0,1fr) 480px;min-height:calc(100vh - 64px);transition:grid-template-columns .2s var(--ease)}
  .main.no-panel{grid-template-columns:minmax(0,1fr) 0}
  .stage{position:relative;display:flex;flex-direction:column;padding:var(--sp-12) var(--sp-16);min-width:0}
  .stage-top,.stage-bot{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-8)}
  .ghost{display:inline-flex;align-items:center;gap:var(--sp-2);height:32px;padding:0 var(--sp-4);border:0;border-radius:var(--radius-sm);background:none;font-size:14px;font-weight:500;color:var(--fg-80);cursor:pointer}
  .ghost:hover{background:var(--role-hover)} .ghost:active{background:var(--role-pressed)}
  .ghost:focus-visible,.seg button:focus-visible,.row:focus-visible,.chip:focus-visible{outline:2px solid var(--interaction-selected-outline);outline-offset:2px}
  .menu-wrap{position:relative}
  .menu{position:absolute;z-index:20;top:36px;min-width:260px;max-height:60vh;overflow:auto;margin:0;padding:var(--sp-4);list-style:none;background:var(--bg-primary);border:1px solid var(--line-outline);border-radius:var(--radius-sm);box-shadow:var(--shadow-xl)}
  .menu[hidden]{display:none}
  .menu.r{right:0} .menu.l{left:0}
  .menu .grp{padding:var(--sp-6) var(--sp-6) var(--sp-2);font-size:12px;font-weight:600;color:var(--fg-45)}
  .menu button{display:flex;justify-content:space-between;gap:var(--sp-6);width:100%;padding:var(--sp-4) var(--sp-6);border:0;border-radius:var(--radius-xs);background:none;text-align:left;font-size:14px;cursor:pointer}
  .menu button:hover{background:var(--role-hover)}
  .menu button[aria-current=true]{color:var(--interaction-selected);font-weight:600}
  .menu button small{color:var(--fg-45);font-size:12px}
  .menu .empty{padding:var(--sp-6);font-size:14px;color:var(--fg-45)}

  .map-box{position:relative;flex:1;display:grid;place-items:center;min-height:560px}
  #map{width:100%;height:100%;max-height:calc(100vh - 64px - 120px);aspect-ratio:1;overflow:visible;transition:opacity .16s ease,transform .16s ease}
  #map.out{opacity:0;transform:scale(.97)}
  #map.pre{opacity:0;transform:scale(1.03);transition:none}

  /* SVG */
  .ring-out{fill:none;stroke:var(--line-strong);stroke-width:1.5}
  .ring-in{fill:none;stroke:var(--brand-company-primary);stroke-width:2.5}
  .core{fill:var(--bg-primary)}
  .dot{fill:var(--fg-100);opacity:.14;transition:fill .2s,opacity .2s}
  .dot.on{fill:var(--brand-company-primary);opacity:.9}
  .link{fill:none;stroke:var(--fg-100);stroke-opacity:.12;stroke-width:var(--w,1.2);stroke-linecap:round;transition:stroke-opacity .2s}
  .link.hot{stroke-opacity:.35}
  .link.on{stroke-opacity:.85}
  .link.dim{stroke-opacity:.05}
  .node{cursor:pointer;outline:none}
  .node circle{fill:var(--bg-theme-300);stroke:var(--line-bold);stroke-width:1.5;transition:fill .15s}
  .n-out circle{fill:var(--f,var(--bg-theme-300))}
  .n-out.on circle{fill:var(--f);stroke-width:3}
  .n-out.dim circle{opacity:.3}
  .n-out:hover circle,.n-out:focus-visible circle{fill:var(--line-bold);opacity:1}
  .n-out .rel{font-weight:700;fill:var(--brand-company-strong,#0052CC)}
  .lg-rel{display:inline-flex;align-items:center;gap:3px}
  .lg-rel i{border-radius:50%;border:1.5px solid var(--line-bold)}
  .lg-w{display:inline-flex;align-items:center;gap:3px}
  .lg-w i{width:14px;border-radius:2px;background:var(--fg-60)}
  .node:hover circle,.node:focus-visible circle,.node.on circle{fill:var(--line-bold)}
  .node:focus-visible circle{stroke:var(--brand-company-primary);stroke-width:3}
  .node text{fill:var(--fg-100);transition:fill .2s,font-weight .2s}
  .n-out text{font-size:12.5px;font-weight:400}
  .n-out.on text{font-weight:700}
  .n-out.dim text{fill:var(--fg-45)}
  .n-in text{font-size:18px;font-weight:700;letter-spacing:var(--tracking-tight)}
  .n-in.dim text{fill:var(--fg-60)}
  .center-btn{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
  .center-btn .hit{fill:transparent;stroke:none}
  .center-btn:focus-visible .hit{stroke:var(--interaction-selected-outline);stroke-width:4}
  .node{-webkit-tap-highlight-color:transparent}
  .center-fo div{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:0 var(--sp-2)}
  .center-fo .eb{font-size:13px;font-weight:500;color:var(--fg-60)}
  .center-fo .nm{margin-top:var(--sp-2);font-size:26px;font-weight:700;line-height:1.25;letter-spacing:var(--tracking-tight)}
  .center-fo .ct{margin-top:var(--sp-4);font-size:13px;color:var(--fg-60)}
  .center-fo .ct b{color:var(--brand-company-primary);font-weight:700}

  /* tooltip (HDS tooltip) */
  .tip{position:fixed;z-index:40;pointer-events:none;max-width:260px;padding:var(--sp-4) var(--sp-6);border-radius:var(--radius-sm);background:var(--fg-100);color:#fff;font-size:12px;line-height:1.5;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
  .tip.show{opacity:1;transform:none}
  .tip b{display:block;font-size:14px;font-weight:600}
  .tip span{color:rgba(255,255,255,.7)}

  .legend{display:flex;gap:var(--sp-10);font-size:12px;color:var(--fg-60)}
  .legend span{display:inline-flex;align-items:center;gap:var(--sp-3)}
  .legend i{display:inline-block}
  .lg-in{width:14px;height:0;border-top:2.5px solid var(--brand-company-primary);border-radius:2px}
  .lg-out{width:14px;height:0;border-top:1.5px solid var(--line-strong)}
  .lg-dot{width:6px;height:6px;border-radius:50%;background:var(--brand-company-primary)}

  /* ===== Panel ===== */
  .panel{position:relative;overflow:hidden;border-left:1px solid var(--line-layout);background:var(--bg-primary)}
  .panel-in{position:sticky;top:64px;width:480px;height:calc(100vh - 64px);overflow:auto;padding:var(--sp-12)}
  .fx{transition:opacity .16s ease,transform .16s ease}
  .fx.out{opacity:0;transform:translateY(-4px)}
  .fx.pre{opacity:0;transform:translateY(8px);transition:none}
  .crumb{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);margin:0;font-size:12px;font-weight:500;color:var(--fg-45)}
  .crumb button{border:0;padding:0;background:none;color:var(--interaction-selected);cursor:pointer;font-size:12px;font-weight:500}
  .p-title{margin:var(--sp-4) 0 0;font-size:24px;font-weight:700;line-height:var(--lh-tight);letter-spacing:var(--tracking-normal)}
  .p-title small{display:block;font-size:14px;font-weight:500;color:var(--fg-60)}
  .p-desc{margin:var(--sp-6) 0 0;font-size:14px;line-height:var(--lh-body);color:var(--fg-80)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-4);margin-top:var(--sp-12)}
  .kpi{padding:var(--sp-8);border-radius:var(--radius-md);background:var(--bg-alternative)}
  .kpi small{display:block;font-size:12px;color:var(--fg-60)}
  .kpi b{display:block;margin-top:var(--sp-2);font-size:24px;font-weight:800;letter-spacing:var(--tracking-tight)}
  .seg{display:flex;margin-top:var(--sp-16);padding:var(--sp-2);border-radius:var(--radius-sm);background:var(--interaction-button-subtle)}
  .seg button{flex:1;height:36px;border:0;border-radius:6px;background:none;font-size:14px;font-weight:500;color:var(--fg-60);cursor:pointer;transition:background .15s,color .15s}
  .seg button[aria-selected=true]{background:var(--bg-primary);color:var(--fg-100);font-weight:600;box-shadow:var(--shadow-sm)}
  .tab-body{margin-top:var(--sp-8)}
  .sub{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 var(--sp-4);font-size:12px;color:var(--fg-45)}
  .row{display:flex;align-items:center;gap:var(--sp-6);width:100%;padding:var(--sp-6) var(--sp-4);border:0;border-bottom:1px solid var(--line-layout);background:none;text-align:left;cursor:pointer;transition:background .15s}
  .row:hover{background:var(--role-hover)}
  .row[aria-current=true]{background:var(--interaction-selected-bg)}
  .row .tx{flex:1;min-width:0}
  .row .tx b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .tx small{display:block;margin-top:var(--sp-1);font-size:12px;color:var(--fg-60);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .rt{font-size:14px;font-weight:700;white-space:nowrap}
  .row .rt small{font-weight:400;color:var(--fg-45);font-size:12px}
  .bar{position:relative;height:4px;margin-top:var(--sp-3);border-radius:var(--radius-full);background:var(--bg-theme-300);overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--brand-company-primary)}
  .row .ico{color:var(--fg-45)}
  .row.static{cursor:default}
  .row.static:hover{background:none}
  .chips{display:flex;flex-wrap:wrap;gap:var(--sp-4)}
  .chip{display:inline-flex;align-items:center;height:32px;padding:0 var(--sp-6);border:1px solid var(--line-outline);border-radius:var(--radius-full);background:var(--bg-primary);font-size:14px;color:var(--fg-80)}
  .chip.more{border-style:dashed;color:var(--fg-45)}
  .badge{display:inline-flex;align-items:center;height:20px;padding:0 var(--sp-3);border-radius:var(--radius-xs);background:var(--interaction-selected-bg);color:var(--brand-company-strong);font-size:12px;font-weight:600}
  .badge.gray{background:var(--interaction-button-subtle);color:var(--fg-60)}
  .note{margin-top:var(--sp-12);padding:var(--sp-8);border-radius:var(--radius-sm);background:var(--bg-alternative);font-size:12px;line-height:var(--lh-body);color:var(--fg-60)}
  .empty-st{padding:var(--sp-16) 0;text-align:center;font-size:14px;color:var(--fg-45)}

  @media (max-width:1100px){
    .main,.main.no-panel{grid-template-columns:1fr}
    .panel{border-left:0;border-top:1px solid var(--line-layout)}
    .panel-in{position:static;width:auto;height:auto}
    .main.no-panel .panel{display:none}
    #map{max-height:none}
    .gnb .stat{display:none}
  }
  @media (max-width:640px){
    .gnb{padding:0 var(--sp-8);gap:var(--sp-6)}
    .logo span{display:none}
    .stage{padding:var(--sp-8)}
    .map-box{min-height:0}
    .legend{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
  /* ===== Type 1 v2: 직무 중심 · 재중심 · 히스토리 ===== */
  .stage-top{gap:var(--sp-6)}
  .path{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-1);flex:1;min-width:0;justify-content:center;font-size:13px}
  .path button{max-width:180px;height:28px;padding:0 var(--sp-4);border:0;border-radius:6px;background:none;color:var(--fg-60);font-weight:500;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .path button:hover{background:var(--role-hover);color:var(--fg-100)}
  .path button[aria-current=true]{color:var(--fg-100);font-weight:700;cursor:default;background:var(--bg-primary);box-shadow:var(--shadow-sm)}
  .path .sep{color:var(--fg-45)}
  .path .back{display:inline-flex;align-items:center;gap:2px;color:var(--fg-80)}
  .path .back[disabled]{opacity:.35;cursor:default}
  .menu .filter{position:sticky;top:-8px;margin:-8px -8px 4px;padding:8px;background:var(--bg-primary);border-bottom:1px solid var(--line-layout)}
  .menu .filter input{width:100%;height:36px;padding:0 var(--sp-6);border:1px solid var(--line-outline);border-radius:var(--radius-sm);font-size:14px;outline:none}
  .menu .filter input:focus{border-color:var(--interaction-selected-outline)}
  .menu.jobs{min-width:320px}
  .menu .grp b{color:var(--fg-80)}
  /* 탐색 히스토리 (뎁스 트리) */
  .menu.hist{min-width:340px;max-width:420px;padding:var(--sp-6) var(--sp-4)}
  .hist-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 var(--sp-6) var(--sp-4);font-size:12px;color:var(--fg-45)}
  .hist-head b{font-size:14px;color:var(--fg-100)}
  .tree{list-style:none;margin:0;padding:0}
  .tree .tree{margin-left:14px;padding-left:10px;border-left:1px dashed var(--line-strong)}
  .tree li{position:relative}
  .tree .tree>li::before{content:"";position:absolute;left:-10px;top:17px;width:8px;border-top:1px dashed var(--line-strong)}
  .tree button{display:flex;align-items:center;gap:var(--sp-4);width:100%;padding:var(--sp-3) var(--sp-4);border:0;border-radius:var(--radius-xs);background:none;text-align:left;font-size:14px;cursor:pointer}
  .tree button:hover{background:var(--role-hover)}
  .tree button[aria-current=true]{background:var(--interaction-selected-bg);font-weight:700}
  .tree button .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tree button.on-path .nm{font-weight:600}
  .tbadge{flex:none;display:inline-flex;align-items:center;height:18px;padding:0 5px;border-radius:4px;font-size:11px;font-weight:600}
  .tb-job{background:#FFF1E5;color:#B45309}
  .tb-kw{background:var(--interaction-selected-bg);color:var(--brand-company-strong,#0052CC)}
  .tb-grp{background:var(--interaction-button-subtle);color:var(--fg-60)}
  .hist-foot{margin-top:var(--sp-4);padding:var(--sp-4) var(--sp-6) 0;border-top:1px solid var(--line-layout);font-size:12px;color:var(--fg-45)}
  .hist-foot kbd{display:inline-block;padding:0 4px;border:1px solid var(--line-outline);border-radius:3px;font:11px var(--font-sans);color:var(--fg-60)}
  .n-out.t-job circle{stroke:#B45309;stroke-width:2}
  .n-out.t-job text{fill:#B45309}
  .row .tb{margin-right:2px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5m7 7-7-7 7-7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-brief" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 9 5 3-5 3z"/></symbol>
  <symbol id="i-hist" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
</svg>

<header class="gnb">
  <a class="logo" href="#" id="home"><b>HU</b><span>스킬 갤럭시</span></a>
  <div class="search" role="combobox" aria-expanded="false" aria-owns="suggest">
    <svg class="ico"><use href="#i-search"/></svg>
    <input id="q" type="search" placeholder="직무, 스킬, 스킬 그룹으로 찾기" autocomplete="off" aria-label="검색" aria-controls="suggest">
    <ul class="suggest" id="suggest" role="listbox" hidden></ul>
  </div>
  <span class="stat">직무 <b class="num" id="jobN"></b>개 · 스킬 <b class="num" id="totalN"></b>개</span>
</header>

<main class="main" id="main">
  <section class="stage" aria-label="스킬 맵">
    <div class="stage-top">
      <div class="menu-wrap">
        <button class="ghost" id="jobBtn" aria-haspopup="true" aria-expanded="false"><svg class="ico s16"><use href="#i-brief"/></svg>직무 선택<svg class="ico s16"><use href="#i-down"/></svg></button>
        <div class="menu l jobs" id="jobMenu" role="menu" hidden></div>
      </div>
      <nav class="path" id="path" aria-label="현재 경로"></nav>
      <div class="menu-wrap">
        <button class="ghost" id="histBtn" aria-haspopup="true" aria-expanded="false"><svg class="ico s16"><use href="#i-hist"/></svg>탐색 히스토리<svg class="ico s16"><use href="#i-down"/></svg></button>
        <div class="menu r hist" id="histMenu" role="menu" hidden></div>

    </div>

        <span class="lg-rel">연관도 낮음<i style="width:8px;height:8px;background:#CCE0FF"></i><i style="width:11px;height:11px;background:#99C2FF"></i><i style="width:14px;height:14px;background:#66A3FF"></i><i style="width:17px;height:17px;background:#3385FF"></i><i style="width:20px;height:20px;background:#0066FF"></i>높음</span>
        <span class="lg-w">선 두께 = 연관도 <i style="height:1px"></i><i style="height:3px"></i><i style="height:5px"></i></span>
        <span><i style="display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #B45309"></i>&nbsp;직무</span>
      </div>

    </div>

  </aside>
</main>
<div class="tip" id="tip" role="tooltip"></div>

<script src="data.js"></script>
<script src="jobs.js"></script>
<script>
(() => {
const D = window.GALAXY, J = window.JOBS;
const CAT = Object.fromEntries(D.cats.map(c => [c.id, c]));
const G = D.groups;
const JOB = Object.fromEntries(J.jobs.map(j => [j.id, j]));
const KW = J.kw;
const JOBS_BY_KW = {};
J.jobs.forEach(j => j.kw.forEach(k => (JOBS_BY_KW[k] ||= []).push(j.id)));
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const fmt = n => n.toLocaleString('ko-KR');
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const josa = (w, a, b) => { const c = w.trim().charCodeAt(w.trim().length - 1); return (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? a : b; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const R_OUT = 400, R_IN = 178, R_CORE = 146, MAX_INNER = 8, OUT_TARGET = 28;
const relFill = r => r >= 85 ? '#0066FF' : r >= 70 ? '#3385FF' : r >= 55 ? '#66A3FF' : r >= 40 ? '#99C2FF' : '#CCE0FF';
$('#totalN').textContent = fmt(D.total);
$('#jobN').textContent = J.jobs.length;

/* ---------- 노드 모델: job:<id> · kw:<스킬> · grp:<그룹> ---------- */
const typeOf = key => key.slice(0, key.indexOf(':'));
const idOf = key => key.slice(key.indexOf(':') + 1);
const TYPE_LABEL = { job: '직무', kw: '스킬', grp: '스킬 그룹' };
function info(key) {
  const t = typeOf(key), id = idOf(key);
  if (t === 'job') { const j = JOB[id]; return { t, name: j.ko, eyebrow: `직무 · ${j.fam}`, sub: `${j.sub}` }; }
  if (t === 'kw') { const k = KW[id]; return { t, name: id, eyebrow: '스킬', sub: `필요 직무 ${k ? k.n : 0}개` }; }
  const g = G[id], c = CAT[g.cat]; return { t, name: g.name, eyebrow: `스킬 그룹 · ${c.name}`, sub: `스킬 ${fmt(g.n)}개` };
}
// 안쪽 링: 중심의 하위 요소와 중심과의 연관도(0–100)
function children(key) {
  const t = typeOf(key), id = idOf(key);
  let list = [];
  if (t === 'job') {
    // 직무의 주요 스킬. 연관도 = 그 직무에 얼마나 고유한 스킬인가(특이도)
    list = JOB[id].kw.map(k => ({ key: 'kw:' + k, v: KW[k] ? KW[k].spec + .6 : .6 }));
  } else if (t === 'kw') {
    list = (KW[id]?.groups || []).map(([g, r]) => ({ key: 'grp:' + g, v: r }));
  } else {
    list = G[id].links.filter(([o]) => G[o].cat !== G[id].cat).map(([o, w]) => ({ key: 'grp:' + o, v: w }));
  }
  list.sort((a, b) => b.v - a.v);
  list = list.slice(0, MAX_INNER);
  const mx = Math.max(...list.map(x => x.v), 1e-9);
  return list.map(x => ({ key: x.key, rel: Math.round(x.v / mx * 100) }));
}
// 바깥 링: 안쪽 요소에서 한 단계 더 이어지는 요소 (s = 0–1 연결 강도)
function neighbors(key, centerKey) {
  const t = typeOf(key), id = idOf(key);
  if (t === 'kw') {
    const center = typeOf(centerKey) === 'job' ? JOB[idOf(centerKey)] : null;
    const cset = new Set(center ? center.kw : []);
    const jobs = (JOBS_BY_KW[id] || []).filter(j => 'job:' + j !== centerKey)
      .map(j => ({ key: 'job:' + j, s: center ? JOB[j].kw.filter(k => cset.has(k)).length / cset.size : .5 }))
      .sort((a, b) => b.s - a.s).slice(0, 2);
    const grps = (KW[id]?.groups || []).slice(0, 3).map(([g, r]) => ({ key: 'grp:' + g, s: r / 100 }));
    return [...grps, ...jobs];
  }
  if (t === 'grp') {
    const ls = G[id].links.filter(([o]) => G[o].cat !== G[id].cat);
    const mx = ls[0] ? ls[0][1] : 1;
    return ls.map(([o, w]) => ({ key: 'grp:' + o, s: w / mx }));
  }
  return [];
}

/* ---------- 지오메트리 ---------- */
const pol = (a, r) => [Math.cos(a) * r, Math.sin(a) * r];
function curve(a1, a2) {
  const d = Math.atan2(Math.sin(a2 - a1), Math.cos(a2 - a1));
  const [x0, y0] = pol(a1, R_IN), [x1, y1] = pol(a1 + d / 2, R_OUT * .75), [x2, y2] = pol(a2, R_OUT * .69), [x3, y3] = pol(a2, R_OUT);
  return `M${x0.toFixed(1)},${y0.toFixed(1)} C${x1.toFixed(1)},${y1.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)} ${x3.toFixed(1)},${y3.toFixed(1)}`;
}
function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function rng(seed) { let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function wrap(text, max) {
  if (text.length <= max) return [text];
  const words = text.split(' '), lines = [''];
  words.forEach(w => { const cur = lines[lines.length - 1]; if ((cur + ' ' + w).trim().length > max && cur) lines.push(w); else lines[lines.length - 1] = (cur + ' ' + w).trim(); });
  return lines.length > 2 ? [lines[0], lines.slice(1).join(' ').slice(0, max - 1) + '…'] : lines;
}

/* ---------- 맵 구성 ---------- */
function compose(centerKey) {
  const inner = children(centerKey);
  const n = Math.max(inner.length, 1);
  const inAng = inner.map((_, i) => -Math.PI / 2 + (i + .5) * (2 * Math.PI / n));
  const k = Math.max(2, Math.min(6, Math.ceil(OUT_TARGET / n)));
  const taken = new Set([centerKey, ...inner.map(x => x.key)]);
  const outMap = new Map();
  inner.forEach((c, i) => {
    let added = 0;
    for (const nb of neighbors(c.key, centerKey)) {
      if (taken.has(nb.key)) continue;
      if (!outMap.has(nb.key)) outMap.set(nb.key, []);
      outMap.get(nb.key).push({ i, s: nb.s });
      if (++added >= k) break;
    }
  });
  const outer = [...outMap.entries()].map(([key, ls]) => {
    let x = 0, y = 0; ls.forEach(l => { x += Math.cos(inAng[l.i]) * l.s; y += Math.sin(inAng[l.i]) * l.s; });
    const raw = Math.max(...ls.map(l => inner[l.i].rel / 100 * l.s));
    return { key, ls, a: Math.atan2(y, x), raw };
  }).sort((p, q) => p.a - q.a);
  const mx = Math.max(...outer.map(o => o.raw), 1e-9);
  outer.forEach(o => o.rel = Math.max(1, Math.round(o.raw / mx * 100)));
  const m = outer.length, step = 2 * Math.PI / Math.max(m, 1);
  let best = 0, bestErr = Infinity;
  for (let s = 0; s < 36; s++) {
    const off = m ? outer[0].a + (s - 18) * step / 6 : 0;
    let err = 0; outer.forEach((o, j) => { const d = Math.atan2(Math.sin(off + j * step - o.a), Math.cos(off + j * step - o.a)); err += d * d; });
    if (err < bestErr) { bestErr = err; best = off; }
  }
  outer.forEach((o, j) => o.ang = best + j * step);
  const relLo = Math.min(...outer.map(o => o.rel), 100);
  return { centerKey, inner, inAng, outer, relLo };
}

/* ---------- 맵 렌더 ---------- */
let view = null;
function drawMap() {
  const svg = $('#map'); svg.innerHTML = '';
  view = compose(cur());
  const { centerKey, inner, inAng, outer } = view, ci = info(centerKey);
  el('circle', { class: 'ring-out', r: R_OUT }, svg);
  const gLinks = el('g', {}, svg);
  el('circle', { class: 'core', r: R_CORE }, svg);

  // 중심: 하위 요소마다 부채꼴로 점 (연관도가 높을수록 많이)
  const gDots = el('g', { class: 'center-btn', role: 'img', 'aria-label': `${ci.name}` }, svg);
  el('circle', { class: 'hit', r: R_CORE }, gDots);
  const span = 2 * Math.PI / Math.max(inner.length, 1);
  inner.forEach((c, i) => {
    const ct = typeOf(c.key);
    const size = ct === 'grp' ? Math.sqrt(G[idOf(c.key)].n) * 4 : ct === 'kw' ? Math.sqrt(KW[idOf(c.key)]?.n || 1) * 10 : 20;
    const n = Math.round(Math.max(8, Math.min(90, size * (.4 + c.rel / 100 * .6))));
    const r = rng(c.key);
    for (let j = 0; j < n; j++) {
      const a = inAng[i] + (r() - .5) * span * .86, rr = Math.sqrt(100 ** 2 + r() * (136 ** 2 - 100 ** 2));
      const [x, y] = pol(a, rr);
      el('circle', { class: 'dot', 'data-i': i, cx: x.toFixed(1), cy: y.toFixed(1), r: (1.3 + r() * 1.5).toFixed(2) }, gDots);
    }
  });
  const fo = el('foreignObject', { class: 'center-fo', x: -100, y: -82, width: 200, height: 164 }, gDots);
  fo.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml"><span class="eb">${esc(ci.eyebrow)}</span><span class="nm">${esc(ci.name)}</span><span class="ct">${esc(ci.sub)}</span></div>`;
  el('circle', { class: 'ring-in', r: R_IN }, svg);

  // 링크 (선 두께 = 연결 강도)
  view.links = [];
  outer.forEach((o, j) => o.ls.forEach(l => {
    const p = el('path', { class: 'link', d: curve(inAng[l.i], o.ang), style: `--w:${(.6 + 4.4 * Math.pow(l.s, 1.6)).toFixed(2)}px` }, gLinks);
    view.links.push({ el: p, i: l.i, j });
  }));

  // 바깥 노드: 크기·색 농도 = 중심과의 연관도
  view.outEls = outer.map((o, j) => {
    const oi = info(o.key), t = typeOf(o.key);
    const [x, y] = pol(o.ang, R_OUT);
    const node = el('g', { class: `node n-out t-${t}`, role: 'button', tabindex: 0, 'aria-label': `${oi.name} (${TYPE_LABEL[t]}, 연관도 ${o.rel})를 중심으로 보기` }, svg);
    const t01 = Math.max(0, (o.rel - view.relLo + 4) / Math.max(1, 100 - view.relLo + 4));
    const r = 5 + 12 * Math.pow(t01, 1.2);
    node.style.setProperty('--f', relFill(o.rel));
    el('circle', { cx: x, cy: y, r: r.toFixed(1) }, node);
    const deg = o.ang * 180 / Math.PI, left = Math.cos(o.ang) < 0;
    const [tx, ty] = pol(o.ang, R_OUT + r + 9);
    const tt = el('text', { x: tx, y: ty, 'dominant-baseline': 'central', 'text-anchor': left ? 'end' : 'start', transform: `rotate(${left ? deg + 180 : deg} ${tx} ${ty})` }, node);
    const nm = oi.name.length > 15 ? oi.name.slice(0, 14) + '…' : oi.name;
    const a1 = el('tspan', {}, tt), a2 = el('tspan', { class: 'rel' }, tt);
    if (left) { a2.textContent = o.rel + ' '; a1.textContent = nm; tt.insertBefore(a2, a1); } else { a1.textContent = nm + ' '; a2.textContent = o.rel; }
    bind(node, o.key, `<b>${esc(oi.name)}</b><span>${esc(TYPE_LABEL[t])} · ${esc(oi.sub)}<br>${esc(ci.name)}${josa(ci.name, '과', '와')} 연관도 <b style="display:inline">${o.rel}</b> · 누르면 중심으로 이동</span>`, { j });
    return node;
  });

  // 안쪽 노드: 크기 = 중심과의 연관도
  view.inEls = inner.map((c, i) => {
    const ii = info(c.key), a = inAng[i];
    const [x, y] = pol(a, R_IN);
    const node = el('g', { class: 'node n-in', role: 'button', tabindex: 0, 'aria-label': `${ii.name} (연관도 ${c.rel})를 중심으로 보기` }, svg);
    const ri = 9 + 9 * Math.pow(c.rel / 100, 1.3);
    el('circle', { cx: x, cy: y, r: ri.toFixed(1) }, node);
    const cs = Math.cos(a), sn = Math.sin(a);
    const anchor = cs > .3 ? 'start' : cs < -.3 ? 'end' : 'middle';
    const lines = wrap(ii.name, 9);
    const lx = x + (anchor === 'start' ? ri + 8 : anchor === 'end' ? -ri - 8 : 0);
    const ly0 = anchor === 'middle' ? y + (sn < 0 ? -ri - 14 - (lines.length - 1) * 22 : ri + 20) : y - (lines.length - 1) * 11;
    const t = el('text', { 'text-anchor': anchor, 'dominant-baseline': 'central' }, node);
    lines.forEach((ln, k) => { const ts = el('tspan', { x: lx, y: ly0 + k * 22 }, t); ts.textContent = ln; });
    bind(node, c.key, `<b>${esc(ii.name)}</b><span>${esc(TYPE_LABEL[typeOf(c.key)])} · ${esc(ii.sub)}<br>${esc(ci.name)}${josa(ci.name, '과', '와')} 연관도 <b style="display:inline">${c.rel}</b> · 누르면 중심으로 이동</span>`, { i });
    return node;
  });
}
function bind(node, key, tipHTML, h) {
  node.addEventListener('click', () => go(key));
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(key); } });
  node.addEventListener('mouseenter', e => { tip.innerHTML = tipHTML; tip.classList.add('show'); moveTip(e); hot(h); });
  node.addEventListener('mousemove', moveTip);
  node.addEventListener('mouseleave', () => { tip.classList.remove('show'); hot(null); });
}
function hot(h) {
  if (!view) return;
  const li = new Set();
  view.links.forEach(l => { const on = !!h && (h.i === l.i || h.j === l.j); l.el.classList.toggle('on', on); l.el.classList.toggle('dim', !!h && !on); if (on) li.add(l.j); });
  view.outEls.forEach((n, j) => { n.classList.toggle('on', !!h && li.has(j) && h.i != null); n.classList.toggle('dim', !!h && h.i != null && !li.has(j)); });
  view.inEls.forEach((n, i) => n.classList.toggle('dim', !!h && h.i != null && h.i !== i));
  document.querySelectorAll('#map .dot').forEach(d => d.classList.toggle('on', !!h && h.i != null && +d.dataset.i === h.i));
}
const tip = $('#tip');
function moveTip(e) { tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 16) + 'px'; }

/* ---------- 패널 ---------- */
let tab = 0;
function panelHTML() {
  const key = cur(), t = typeOf(key), id = idOf(key), ci = info(key);
  const kids = view.inner;
  let head, tabs, bodies;
  const kidRows = (label) => `<p class="sub"><span>${label}</span><span>연관도</span></p>` + kids.map(c => {
    const x = info(c.key);
    return `<button class="row" data-go="${esc(c.key)}"><span class="tx"><b>${esc(x.name)}</b><small>${esc(x.sub)}</small><span class="bar"><i style="width:${c.rel}%"></i></span></span><span class="rt num">${c.rel}</span></button>`;
  }).join('');
  const jobRows = (ids, label, score) => !ids.length ? '<p class="empty-st">연관된 직무가 없습니다.</p>' : `<p class="sub"><span>${label}</span></p>` + ids.map(([jid, s]) => {
    const j = JOB[jid];
    return `<button class="row" data-go="job:${esc(jid)}"><span class="tx"><b>${esc(j.ko)}</b><small>${esc(j.fam)} › ${esc(j.sub)}</small></span>${s != null ? `<span class="rt num">${s}<small> ${score}</small></span>` : ''}</button>`;
  }).join('');
  const contentRows = list => !list.length ? '<p class="empty-st">매칭된 콘텐츠가 없습니다.</p>' : `<p class="sub"><span>휴넷 마이크로러닝</span></p>` + list.map(([tt, time, who, , from]) => `<div class="row static"><svg class="ico"><use href="#i-play"/></svg><span class="tx"><b>${esc(tt)}</b><small>${[who, time].filter(Boolean).map(esc).join(' · ')}${from ? ` · <span class="badge gray">${esc(from)}</span>` : ''}</small></span></div>`).join('');
  const contentsOf = gids => { const seen = new Set(), out = []; gids.forEach(g => (G[g]?.contents || []).slice(0, 2).forEach(c => { if (!seen.has(c[0])) { seen.add(c[0]); out.push([...c, G[g].name]); } })); return out.slice(0, 8); };
  if (t === 'job') {
    const j = JOB[id], kset = new Set(j.kw);
    const rel = J.jobs.filter(x => x.id !== id).map(x => [x.id, x.kw.filter(k => kset.has(k)).length]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 12);
    const gids = kids.flatMap(c => (KW[idOf(c.key)]?.groups || []).slice(0, 1).map(g => g[0]));
    head = `<p class="crumb">직무 › ${esc(j.fam)} › ${esc(j.sub)}</p><h1 class="p-title">${esc(j.ko)}<small>${esc(j.en || '')}</small></h1><p class="p-desc">${esc(j.def)}</p>
      <div class="kpis"><div class="kpi"><small>주요 스킬</small><b class="num">${j.kw.length}</b></div><div class="kpi"><small>연관 직무</small><b class="num">${rel.length}</b></div><div class="kpi"><small>연결 스킬 그룹</small><b class="num">${new Set(gids).size}</b></div></div>`;
    tabs = ['주요 스킬', '연관 직무', '추천 콘텐츠'];
    bodies = [kidRows('연관도 = 이 직무에 얼마나 고유한 스킬인가'), jobRows(rel, '주요 스킬이 겹치는 직무', '개 겹침'), contentRows(contentsOf(gids))];
  } else if (t === 'kw') {
    const jobs = (JOBS_BY_KW[id] || []).map(x => [x, null]);
    head = `<p class="crumb">스킬</p><h1 class="p-title">${esc(id)}</h1><p class="p-desc">${esc(id)}${josa(id, '은', '는')} 직무 ${jobs.length}개가 주요 스킬로 꼽습니다. 휴넷 스킬DB에서 이름이 가장 가까운 스킬 그룹 ${kids.length}개와 이어집니다.</p>
      <div class="kpis"><div class="kpi"><small>필요 직무</small><b class="num">${jobs.length}</b></div><div class="kpi"><small>스킬 그룹</small><b class="num">${kids.length}</b></div><div class="kpi"><small>고유도</small><b class="num">${KW[id] ? Math.round(KW[id].spec / Math.log(J.jobs.length) * 100) : 0}</b></div></div>`;
    tabs = ['스킬 그룹', '필요 직무', '추천 콘텐츠'];
    bodies = [kidRows('이름이 가까운 스킬DB 그룹'), jobRows(jobs, '이 스킬을 주요 스킬로 꼽는 직무'), contentRows(contentsOf(kids.map(c => idOf(c.key))))];
  } else {
    const g = G[id], c = CAT[g.cat];
    const shown = g.skills.slice(0, 40), rest = g.n - shown.length;
    head = `<p class="crumb">스킬 그룹 › ${esc(c.mid)} › ${esc(c.name)}</p><h1 class="p-title">${esc(g.name)}</h1><p class="p-desc">${esc(g.name)}${josa(g.name, '은', '는')} ${esc(c.name)} 분야의 스킬 그룹으로 ${fmt(g.n)}개 스킬을 담고 있습니다.</p>
      <div class="kpis"><div class="kpi"><small>스킬</small><b class="num">${fmt(g.n)}</b></div><div class="kpi"><small>연결 그룹</small><b class="num">${kids.length}</b></div><div class="kpi"><small>추천 콘텐츠</small><b class="num">${g.contents.length}</b></div></div>`;
    tabs = ['스킬', '연결 그룹', '추천 콘텐츠'];
    bodies = [`<p class="sub"><span>이 그룹의 스킬</span><span class="num">${fmt(g.n)}개</span></p><div class="chips">${shown.map(s => `<span class="chip">${esc(s)}</span>`).join('')}${rest > 0 ? `<span class="chip more">외 ${fmt(rest)}개</span>` : ''}</div>`, kidRows('스킬 이름이 비슷한 다른 분야의 그룹'), contentRows(g.contents)];
  }
  return head + `<div class="seg" role="tablist">${tabs.map((l, k) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join('')}</div><div class="tab-body" role="tabpanel">${bodies[tab]}</div>
    <p class="note">직무와 주요 스킬은 휴넷 커리어 데이터(250개 직무), 스킬 그룹은 휴넷 스킬DB v1.0에서 가져왔습니다. 연관도는 따로 정의된 값이 없어 직무 안 스킬의 고유도와 스킬 이름의 유사도로 계산한 대체값이며, 실제 상관도 데이터로 바꿀 수 있습니다.</p>`;
}
function renderPanel(animate) {
  const p = $('#panel'), put = () => { p.innerHTML = panelHTML(); };
  if (!animate || reduce) return put();
  p.classList.add('out');
  setTimeout(() => { put(); p.classList.remove('out'); p.classList.add('pre'); p.offsetWidth; p.classList.remove('pre'); }, 140);
}
$('#panel').addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-go]'); if (!t) return;
  if (t.dataset.tab) { tab = +t.dataset.tab; renderPanel(false); } else go(t.dataset.go);
});

/* ---------- 경로 · 브라우저 히스토리 · 탐색 히스토리 트리 ---------- */
let path = [];                      // 현재 경로 (루트 직무 → … → 현재 중심)
const cur = () => path[path.length - 1];
const enc = p => '#p=' + p.map(encodeURIComponent).join('~');
const dec = h => { const m = h.match(/#p=(.*)$/); if (!m) return null; const p = m[1].split('~').map(decodeURIComponent).filter(valid); return p.length ? p : null; };
function valid(k) { const t = typeOf(k), id = idOf(k); return t === 'job' ? !!JOB[id] : t === 'kw' ? !!KW[id] : t === 'grp' ? !!G[id] : false; }
// 탐색 트리: 같은 경로는 한 번만 기록, 갈래가 생기면 형제로 쌓임
const treeRoots = []; let treeSeq = 0;
function record(p) {
  let level = treeRoots, node = null;
  p.forEach(k => {
    node = level.find(n => n.key === k);
    if (!node) { node = { key: k, kids: [], seq: ++treeSeq }; level.push(node); }
    node.last = ++treeSeq;
    level = node.kids;
  });
}
function go(key, opts = {}) {
  if (!valid(key) || key === cur()) return;
  // 이미 지나온 요소면 그 지점으로 경로를 되돌리고, 아니면 한 단계 더 들어감
  const at = path.indexOf(key);
  const next = opts.root ? [key] : at >= 0 ? path.slice(0, at + 1) : [...path, key];
  history.pushState({ p: next }, '', enc(next));
  show(next, true);
}
function show(p, animate) {
  path = p; tab = 0; record(p);
  const svg = $('#map');
  const swap = () => { drawMap(); renderPanel(animate); renderPath(); };
  if (!animate || reduce) swap();
  else { svg.classList.add('out'); setTimeout(() => { swap(); svg.classList.remove('out'); svg.classList.add('pre'); svg.getBoundingClientRect(); svg.classList.remove('pre'); }, 160); }
  tip.classList.remove('show');
  closeMenus();
}
addEventListener('popstate', e => { const p = (e.state && e.state.p) || dec(location.hash); if (p) show(p, true); });
// Backspace = 뒤로 (입력 중일 때 제외). 마우스 뒤로 버튼·Alt+← 는 브라우저가 popstate로 처리
addEventListener('keydown', e => {
  if (e.key !== 'Backspace' || e.metaKey || e.ctrlKey || e.altKey) return;
  const tg = e.target; if (tg.closest && tg.closest('input,textarea,select,[contenteditable]')) return;
  e.preventDefault(); history.back();
});

function renderPath() {
  const nav = $('#path');
  nav.innerHTML = `<button class="back" id="backBtn" title="뒤로 (Backspace)" ${history.state && path.length > 0 && history.length > 1 ? '' : ''}><svg class="ico s16"><use href="#i-left"/></svg></button>` +
    path.map((k, i) => (i ? '<span class="sep" aria-hidden="true">›</span>' : '') + `<button data-pi="${i}" ${i === path.length - 1 ? 'aria-current="true"' : ''} title="${esc(TYPE_LABEL[typeOf(k)])}">${esc(info(k).name)}</button>`).join('');
}
$('#path').addEventListener('click', e => {
  if (e.target.closest('#backBtn')) return history.back();
  const b = e.target.closest('button[data-pi]'); if (!b || b.hasAttribute('aria-current')) return;
  go(path[+b.dataset.pi]);
});

function histHTML() {
  const curKey = path.join('~');
  const li = (n, prefix) => {
    const p = [...prefix, n.key], pk = p.join('~'), onPath = curKey.startsWith(pk), isCur = pk === curKey;
    const t = typeOf(n.key);
    return `<li><button data-path="${esc(pk)}" class="${onPath ? 'on-path' : ''}" ${isCur ? 'aria-current="true"' : ''}><span class="tbadge tb-${t}">${TYPE_LABEL[t]}</span><span class="nm">${esc(info(n.key).name)}</span></button>${n.kids.length ? `<ul class="tree">${n.kids.map(c => li(c, p)).join('')}</ul>` : ''}</li>`;
  };
  return `<div class="hist-head"><b>탐색 히스토리</b><span>${treeSeq ? '지나온 경로를 단계별로 보여 줍니다' : ''}</span></div><ul class="tree">${treeRoots.map(r => li(r, [])).join('')}</ul>
    <p class="hist-foot">항목을 누르면 그 지점으로 이동합니다. 뒤로 가기: 마우스 뒤로 버튼, <kbd>Backspace</kbd>, <kbd>Alt</kbd>+<kbd>←</kbd></p>`;
}

/* ---------- 메뉴: 직무 선택 / 탐색 히스토리 ---------- */
function closeMenus() { document.querySelectorAll('.menu').forEach(m => m.hidden = true); document.querySelectorAll('[aria-haspopup]').forEach(b => b.setAttribute('aria-expanded', 'false')); }
function toggleMenu(btn, menu, build) {
  const open = menu.hidden; closeMenus();
  if (open) { menu.innerHTML = build(); menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); menu.querySelector('input')?.focus(); }
}
function jobList(q) {
  q = (q || '').trim().toLowerCase();
  const fams = [...new Set(J.jobs.map(j => j.fam))];
  return fams.map(f => {
    const js = J.jobs.filter(j => j.fam === f && (!q || (j.ko + ' ' + j.en + ' ' + j.sub).toLowerCase().includes(q)));
    if (!js.length) return '';
    return `<div class="grp"><b>${esc(f)}</b> · ${js.length}</div>` + js.map(j => `<button role="menuitem" data-key="job:${esc(j.id)}" aria-current="${path[0] === 'job:' + j.id}"><span>${esc(j.ko)}</span><small>${esc(j.sub)}</small></button>`).join('');
  }).join('') || '<p class="empty">일치하는 직무가 없습니다.</p>';
}
$('#jobBtn').addEventListener('click', e => { e.stopPropagation(); toggleMenu(e.currentTarget, $('#jobMenu'), () => `<div class="filter"><input type="search" id="jobQ" placeholder="직무 이름으로 거르기" aria-label="직무 거르기"></div><div id="jobList">${jobList('')}</div>`); });
$('#jobMenu').addEventListener('input', e => { if (e.target.id === 'jobQ') $('#jobList').innerHTML = jobList(e.target.value); });
$('#jobMenu').addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('button[data-key]'); if (b) go(b.dataset.key, { root: true }); });
$('#histBtn').addEventListener('click', e => { e.stopPropagation(); toggleMenu(e.currentTarget, $('#histMenu'), histHTML); });
$('#histMenu').addEventListener('click', e => {
  e.stopPropagation(); const b = e.target.closest('button[data-path]'); if (!b || b.hasAttribute('aria-current')) return;
  const p = b.dataset.path.split('~'); history.pushState({ p }, '', enc(p)); show(p, true);
});
document.addEventListener('click', closeMenus);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); hideSuggest(); } });
$('#panelBtn').addEventListener('click', e => {
  const m = $('#main'); m.classList.toggle('no-panel'); const hidden = m.classList.contains('no-panel');
  e.currentTarget.querySelector('span').textContent = hidden ? '패널 보기' : '패널 숨기기';
  e.currentTarget.querySelector('use').setAttribute('href', hidden ? '#i-left' : '#i-right');
});
$('#home').addEventListener('click', e => { e.preventDefault(); go(DEFAULT, { root: true }); });

/* ---------- 검색 ---------- */
const index = [];
J.jobs.forEach(j => index.push({ t: j.ko, k: (j.ko + ' ' + j.en).toLowerCase(), sub: `직무 · ${j.fam}`, key: 'job:' + j.id, w: 3 }));
Object.keys(KW).forEach(k => index.push({ t: k, k: k.toLowerCase(), sub: `스킬 · 직무 ${KW[k].n}개`, key: 'kw:' + k, w: 2 }));
Object.entries(G).forEach(([id, g]) => index.push({ t: g.name, k: g.name.toLowerCase(), sub: `스킬 그룹 · ${CAT[g.cat].name}`, key: 'grp:' + id, w: 1 }));
const q = $('#q'), sg = $('#suggest'); let hits = [], hi = -1;
function hideSuggest() { sg.hidden = true; q.parentElement.setAttribute('aria-expanded', 'false'); }
q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase(); if (!v) return hideSuggest();
  hits = index.filter(x => x.k.includes(v)).sort((a, b) => (b.k.startsWith(v) - a.k.startsWith(v)) || b.w - a.w || a.t.length - b.t.length).slice(0, 12); hi = -1;
  sg.innerHTML = hits.length ? hits.map((h, i) => `<li role="option" data-i="${i}" aria-selected="false"><span>${esc(h.t)}</span><small>${esc(h.sub)}</small></li>`).join('') : '<li class="empty">일치하는 결과가 없습니다.</li>';
  sg.hidden = false; q.parentElement.setAttribute('aria-expanded', 'true');
});
q.addEventListener('keydown', e => {
  if (sg.hidden || !hits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); hi = (hi + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length; sg.querySelectorAll('li').forEach((li, i) => li.setAttribute('aria-selected', i === hi)); }
  if (e.key === 'Enter') { e.preventDefault(); pick(hits[Math.max(hi, 0)]); }
});
sg.addEventListener('mousedown', e => { const li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); pick(hits[+li.dataset.i]); } });
q.addEventListener('blur', () => setTimeout(hideSuggest, 100));
function pick(h) { hideSuggest(); q.value = ''; q.blur(); go(h.key, { root: typeOf(h.key) === 'job' }); }

/* ---------- 시작 ---------- */
const DEFAULT = 'job:' + (J.jobs.find(j => j.ko === '경영 전략') || J.jobs[0]).id;
const start = dec(location.hash) || [DEFAULT];
history.replaceState({ p: start }, '', enc(start));
show(start, false);
})();
</script>
</body>
</html>
